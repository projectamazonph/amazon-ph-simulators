<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #F4F7F6;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
        }
        .header {
            background-color: #131921;
            padding: 40px 60px;
            border-bottom: 8px solid #FF9900;
        }
        .header h1 {
            color: #FFFFFF;
            font-size: 48px;
            font-weight: 700;
        }
        .content-area {
            flex: 1;
            display: flex;
            padding: 40px 60px;
            gap: 40px;
        }
        .left-col {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .right-col {
            flex: 0.8;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #E2E8F0;
            border: 8px solid #131921;
            padding: 30px;
        }
        .match-table {
            width: 100%;
            border-collapse: collapse;
            border: 8px solid #131921;
            background-color: #FFFFFF;
        }
        .match-table th, .match-table td {
            border: 2px solid #131921;
            padding: 15px 20px;
            text-align: left;
            font-size: 24px;
            color: #333333;
        }
        .match-table th {
            background-color: #131921;
            color: #FFFFFF;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .match-table tr:nth-child(even) {
            background-color: #E2E8F0;
        }
        .col-type {
            font-weight: 700;
            color: #111111;
        }
        .col-reach, .col-control {
            font-family: 'Courier New', Courier, monospace;
            font-weight: 600;
            color: #0052FF;
        }
        .video-container {
            width: 100%;
            text-align: center;
        }
        .video-thumbnail {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border: 4px solid #131921;
            margin-bottom: 20px;
        }
        .watch-label {
            font-size: 24px;
            font-weight: 700;
            color: #FF9900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        .video-title {
            font-size: 24px;
            font-weight: 700;
            color: #131921;
            font-style: italic;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="header">
            <h1>Match types trade reach for control</h1>
        </div>
        <div class="content-area">

                            <th>Match type</th>
                            <th>Reach</th>
                            <th>Control</th>
                            <th>Core use</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="col-type">Broad</td>
                            <td class="col-reach">High</td>
                            <td class="col-control">Low</td>
                            <td>Discover related queries</td>
                        </tr>
                        <tr>
                            <td class="col-type">Phrase</td>
                            <td class="col-reach">Medium</td>
                            <td class="col-control">Medium</td>
                            <td>Test phrase-contained intent</td>
                        </tr>
                        <tr>
                            <td class="col-type">Exact</td>
                            <td class="col-reach">Low</td>
                            <td class="col-control">High</td>
                            <td>Concentrate proven demand</td>

</html>
