<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #F4F7F6;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
        }
        .header {
            background-color: #131921;
            padding: 40px 60px;
            border-bottom: 8px solid #FF9900;
        }
        .header h1 {
            color: #FFFFFF;
            font-size: 48px;
            font-weight: 700;
        }
        .content-area {
            flex: 1;
            display: flex;
            padding: 60px;
            gap: 60px;
        }
        .left-col {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .right-col {
            flex: 0.8;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #E2E8F0;
            border: 8px solid #131921;
            padding: 30px;
        }
        .bullet-list {
            list-style: none;
        }
        .bullet-list li {
            font-size: 32px;
            color: #333333;
            line-height: 1.4;
            margin-bottom: 30px;
            position: relative;
            padding-left: 40px;
        }
        .bullet-list li::before {
            content: "■";
            color: #FF9900;
            position: absolute;
            left: 0;
            top: 5px;
            font-size: 28px;
        }
        .highlight {
            color: #0052FF;
            font-weight: 600;
        }
        .video-container {
            width: 100%;
            text-align: center;
        }
        .video-thumbnail {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border: 4px solid #131921;
            margin-bottom: 20px;
        }
        .watch-label {
            font-size: 24px;
            font-weight: 700;
            color: #FF9900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        .video-title {
            font-size: 24px;
            font-weight: 700;
            color: #131921;
            font-style: italic;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="header">
            <h1>Harvest the report every week</h1>
        </div>
        <div class="content-area">
            <div class="left-col">
                <ul class="bullet-list">
                    <li>Download the report and sort by spend.</li>
                    <li>Mark each term as <span class="highlight">winner, waster, or maybe</span>.</li>
                    <li>Promote profitable winners to Exact; block clearly irrelevant wasters.</li>
                    <li>Log the action, rationale, and result before the next review.</li>
                </ul>
            </div>
