<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #F4F7F6;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
        }
        .header {
            background-color: #131921;
            padding: 40px 60px;
            border-bottom: 8px solid #FF9900;
        }
        .header h1 {
            color: #FFFFFF;
            font-size: 48px;
            font-weight: 700;
        }
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 40px 60px;
        }
        .allocation-table {
            width: 100%;
            border-collapse: collapse;
            border: 8px solid #131921;
            background-color: #FFFFFF;
            margin-bottom: 40px;
        }
        .allocation-table th, .allocation-table td {
            border: 2px solid #131921;
            padding: 20px 25px;
            text-align: left;
            font-size: 28px;
            color: #333333;
        }
        .allocation-table th {
            background-color: #131921;
            color: #FFFFFF;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .allocation-table tr:nth-child(even) {
            background-color: #E2E8F0;
        }
        .col-job {
            width: 35%;
            font-weight: 700;
            color: #111111;
        }
        .col-share {
            width: 25%;
            font-family: 'Courier New', Courier, monospace;
            font-weight: 700;
            color: #0052FF;
        }
        .col-rule {
            width: 40%;
        }
        .exercise-box {
            background-color: #131921;
            border-left: 8px solid #FF9900;
            padding: 30px;
            margin-top: auto;
            display: flex;
            align-items: center;
        }
        .exercise-title {
            font-size: 24px;
            font-weight: 700;
            color: #FF9900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-right: 30px;
            white-space: nowrap;
        }
        .exercise-text {
            font-size: 32px;
            color: #FFFFFF;
            font-weight: 600;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="header">
            <h1>Build a safe starter skeleton</h1>
        </div>
        <div class="content-area">
            <table class="allocation-table">
                <thead>
                    <tr>
                        <th class="col-job">Campaign Job</th>
                        <th class="col-share">Starting Share</th>
                        <th class="col-rule">Operating Rule</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="col-job">Auto research</td>
                        <td class="col-share">30–40%</td>
                        <td class="col-rule">Discover queries</td>
                    </tr>
                    <tr>
                        <td class="col-job">Exact core</td>
                        <td class="col-share">50–60%</td>
                        <td class="col-rule">Convert proven demand</td>
                    </tr>
                    <tr>
                        <td class="col-job">Product targeting</td>
                        <td class="col-share">0–10%</td>
                        <td class="col-rule">Run controlled experiments</td>
                    </tr>
                </tbody>
            </table>
            <div class="exercise-box">
                <div class="exercise-title">Exercise</div>
                <div class="exercise-text">Split a $20 daily budget and defend the trade-off.</div>
            </div>
        </div>
    </div>
</body>
</html>
