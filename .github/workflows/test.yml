name: Test suite

on:
  push:
    branches: [master]
  # Deliberately unfiltered: stacked pull requests target feature branches, and a gate that
  # only fires against master lets exactly the work-in-progress merges skip the suite.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Page and core contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12

      # The suite is zero-dependency (node:test only); no install step, so a
      # dependency outage can never mask a broken page.
      - name: Run test suite
        run: npm test
