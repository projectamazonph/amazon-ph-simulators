<script>
/* ================= CORE ================= */
const IMG = {
  logo:"https://image.qwenlm.ai/public_source/d80161d4-a539-4d7d-ad02-e4820ce49448/1454586fe-d415-465f-b36d-1ccd28255660.png",
  hero:"https://image.qwenlm.ai/public_source/d80161d4-a539-4d7d-ad02-e4820ce49448/1a8d96df3-20f4-4e5b-b56d-d1705f5f0e80.png",
  coach:"https://image.qwenlm.ai/public_source/d80161d4-a539-4d7d-ad02-e4820ce49448/163fc5120-0387-4fd1-abba-76a434d9ee25.png",
  market:"https://image.qwenlm.ai/public_source/d80161d4-a539-4d7d-ad02-e4820ce49448/126c76305-a39a-4c76-864f-ae21beb3a914.png",
  auction:"https://image.qwenlm.ai/public_source/d80161d4-a539-4d7d-ad02-e4820ce49448/1ddc9c1b1-fec5-46f3-8fee-ea240684f102.png",
  listing:"https://image.qwenlm.ai/public_source/d80161d4-a539-4d7d-ad02-e4820ce49448/167723db7-b9e5-4e70-8eff-4ce3a8ce7fd2.png",
  keywords:"https://image.qwenlm.ai/public_source/d80161d4-a539-4d7d-ad02-e4820ce49448/1f06a5489-3268-46c5-8b53-dc262e22550d.png",
  reporting:"https://image.qwenlm.ai/public_source/d80161d4-a539-4d7d-ad02-e4820ce49448/149aeccd5-72e3-43a9-b827-5f3dd32c25f7.png",
  va:"https://image.qwenlm.ai/public_source/d80161d4-a539-4d7d-ad02-e4820ce49448/1229de91a-190a-4ff7-a7c6-1bd7a0300077.png"
};
const LEVELS=[{xp:0,name:"Trainee"},{xp:100,name:"PPC Learner"},{xp:250,name:"PPC Helper"},{xp:450,name:"Junior Assistant"},{xp:700,name:"Campaign Assistant"},{xp:1000,name:"Competent Manager"}];
const ASSESSMENT_BANDS="Module pass 70% · Simulator proficiency 75% · Supervised readiness 85%";
const SKEY="ppcCoachState_v2";
const SIMHUB_BRIDGE_PARAMS=new URLSearchParams(window.location.search);
function publishSimHubQuizReceipt(quizId,score){
 try{
  const token=SIMHUB_BRIDGE_PARAMS.get("simhubQuizToken"),returnOrigin=SIMHUB_BRIDGE_PARAMS.get("simhubReturnOrigin"),moduleId=SIMHUB_BRIDGE_PARAMS.get("simhubModule");
  if(!token||!returnOrigin||!moduleId||!(quizId===moduleId||(moduleId==="m11"&&quizId==="final"))||!window.opener)return;
  if(new URL(returnOrigin).origin!==returnOrigin)return;
  window.opener.postMessage({source:"simhub-static-bridge",kind:"quiz_result",token:token,moduleId:moduleId,quizId:quizId,score:score},returnOrigin);
 }catch(error){ /* Preserve PPC Coach if the optional SimHub bridge cannot post. */ }
}
let state=loadState();
function loadState(){ try{const s=JSON.parse(localStorage.getItem(SKEY)); if(s) return s;}catch(e){} return {xp:0,done:[],quizScores:{},trainerBest:0,trainerDone:false,builderBest:0,builderDone:false,reportDone:false,coachAsked:false}; }
function save(){ localStorage.setItem(SKEY,JSON.stringify(state)); }
function levelFor(xp){ let i=0; for(let k=0;k<LEVELS.length;k++){ if(xp>=LEVELS[k].xp) i=k; } const cur=LEVELS[i],next=LEVELS[i+1]||null; return {i,name:cur.name,next,pct:next?Math.min(100,Math.round((xp-cur.xp)/(next.xp-cur.xp)*100)):100}; }
function toast(msg,type){ const root=document.getElementById("toastRoot"); const c={xp:"bg-navy text-white",level:"bg-emerald-600 text-white",info:"bg-white text-navy border border-slate-200",warn:"bg-red-600 text-white"}; const el=document.createElement("div"); el.className="toast rounded-xl shadow-card px-4 py-3 text-sm font-semibold flex items-center gap-2 "+(c[type]||c.info); el.append(document.createTextNode(type==="xp"?"⚡":type==="level"?"🎉":type==="warn"?"⚠️":"")); const text=document.createElement("span"); text.textContent=msg; el.append(text); root.appendChild(el); setTimeout(()=>{el.style.transition="all .4s";el.style.opacity="0";el.style.transform="translateX(40px)";setTimeout(()=>el.remove(),400);},3400); }
function addXp(n,why){ const b=levelFor(state.xp).i; state.xp+=n; save(); toast("+"+n+" XP · "+why,"xp"); const a=levelFor(state.xp); if(a.i>b) setTimeout(()=>toast("Level up! You are now "+a.name,"level"),450); updateTopbar(); }
function updateTopbar(){ const L=levelFor(state.xp); document.getElementById("xpPill").textContent="⚡ "+state.xp+" XP"; document.getElementById("lvlPill").textContent="🎓 "+L.name; document.getElementById("sideLevel").textContent=L.name; document.getElementById("sideXpBar").style.width=L.pct+"%"; document.getElementById("sideXpTxt").textContent=L.next?state.xp+" / "+L.next.xp+" XP to "+L.next.name:state.xp+" XP · Top level!"; }

/* ================= COURSE CONTENT (12 modules, 60 lessons, 12 module quizzes + final exam) ================= */
// Lesson ID map migrated from prior structure on 2026-08-26.
// Old IDs m0l1..m11l4 remap to m1l1..m12l6 in the new 12-module layout.
const LESSON_ID_MIGRATION={"m0l1":"m1l1","m0l2":"m1l3","m0l3":"m1l4","m1l1":"m2l1","m1l2":"m2l2","m1l3":"m2l3","m2l1":"m2l4","m2l2":"m2l4","m2l3":"m2l5","m2l4":"m2l6","m3l1":"m3l1","m3l2":"m3l2","m3l3":"m3l4","m4l1":"m4l1","m4l2":"m4l2","m4l3":"m4l2","m4l4":"m4l4","m5l1":"m1l2","m5l2":"m1l3","m5l3":"m10l2","m6l1":"m5l3","m6l2":"m6l2","m6l3":"m6l4","m7l1":"m8l1","m7l2":"m6l4","m7l3":"m8l6","m8l1":"m9l1","m8l2":"m9l3","m8l3":"m9l5","m9l1":"m11l1","m9l2":"m11l2","m9l3":"m2l6","m10l1":"m12l1","m10l2":"m12l2","m10l3":"m10l2","m10l4":"m10l3","m11l1":"m12l5","m11l2":"m12l5","m11l3":"m11l6","m11l4":"m12l6"};
function migrateState(){ try{ const old=JSON.parse(localStorage.getItem("ppccoach.doneBackup")||"null"); if(!old){ localStorage.setItem("ppccoach.doneBackup",JSON.stringify(state.done)); const newDone=[]; state.done.forEach(id=>{ const mapped=LESSON_ID_MIGRATION[id]||id; if(!newDone.includes(mapped)) newDone.push(mapped); }); state.done=newDone; saveState(); } }catch(e){} }
const MODULES=[
{title:"Amazon Advertising Foundations",icon:"🛒",color:"#FF9900",img:IMG.market,desc:"Marketplace basics, ad types, the listing, and why retail readiness comes first.",
lessons:[
{id:"m1l1",title:"What is the Amazon Marketplace?",mins:5,blocks:[
{t:"goal",x:"Build the mental model of Amazon as a marketplace (not a store), explain who the seller is, and show why paid ads are only one piece of the system."},
{t:"p",x:"Amazon is a marketplace, not a store. A store is owned and stocked by one company; you walk in, you see what they decided to put on the shelves, and you buy it or you leave. A marketplace is a building that anyone can rent shelf space in. The building charges rent, attracts the foot traffic, and runs the cash registers. The seller — your client, your future employer, or one day you — pays for the shelf, ships the inventory into Amazon's warehouses, and competes with every other seller on the same page for the shopper's attention."},
{t:"p",x:"This is the single most important fact about Amazon for a PPC manager: shoppers come to search, not to browse. They have typed something into the search bar. They are not looking at the home page. They are not scrolling categories for fun. They have a problem or a want, and they want the answer in the next 30 seconds. Every product detail page is a search result, not a destination — and the search results page is a paid auction, even when the rows say 'Sponsored' only on a few of them."},
{t:"p",x:"Most sellers never meet a customer. There is no in-person interaction, no chance to recover a bad first impression with a friendly smile, no physical display that 'just feels right'. The listing is the entire product experience. Photos, title, bullets, price, reviews, stock — that is the product. If the listing is weak, the seller has a weak product, no matter how good the actual item in the box is."},
{t:"example",x:"Bamboo Cutting Board, $24.99. A shopper searches 'bamboo cutting board large' on her phone. Amazon shows 8 rows: 4 sponsored (labeled 'Sponsored'), 4 organic. She clicks row 3 — a sponsored ad. She lands on a product page with 5 photos, a 4.6-star rating, and 312 reviews. The price is shown next to a $19.99 competitor. She adds to cart. The seller pays Amazon a referral fee (about 15% of $24.99 = $3.75) and pays the seller who clicked the ad roughly $0.85. Net to the seller: $20.39 before cost of goods. The marketplace owns the shopper, owns the page, and took a fee for matching them. The seller owns the listing, the inventory, the reviews, and the ad that earned the click."},
{t:"p",x:"Your job as a PPC manager is to buy visibility. The listing's job is to earn the sale. These are two different jobs, owned by two different parts of the business, and they have to win together. A great ad into a weak listing wastes money; a great listing with no ad sits invisible next to a competitor who is buying the top of the page. PPC is the lever that connects a finished product to the shopper who is actively looking for it."},
{t:"formula",f:"Amazon = marketplace + listing + ads. The marketplace brings the shopper. The listing earns the sale. The ad buys the click that connects them.",note:"A 15% referral fee and a 5–10% FBA fee are normal. Plan your margin against gross revenue, not against price."},
{t:"mistake",items:[
"Treating Amazon like a store the seller controls end-to-end — they do not control the page, the search algorithm, or the buyer's first impression",
"Reading 'Sponsored' rows as different from 'organic' rows — they are both auction results, and the shopper does not care which is which",
"Believing a great product is enough — Amazon does not surface great products that nobody clicks; ads are part of how great gets found",
"Skipping the listing because the product is 'obviously good' — the shopper has 30 seconds and 7 other options; the listing does the convincing"
]},
{t:"tip",x:"Open Amazon in your browser. Pick any product category. Notice how many of the first 8 results say 'Sponsored'. Notice how different each listing is. That page is the battlefield your ads will be fighting on."}
]},
{id:"m1l2",title:"Sponsored Products, Brands, and Display",mins:5,blocks:[
{t:"goal",x:"Name the three Amazon ad types and pick the right one for a simple objective."},
{t:"table",head:["Type","What it shows","Best for"],rows:[
["Sponsored Products (SP)","A single product in search and on product pages","Beginners. Most spend. The default starting point."],
["Sponsored Brands (SB)","A banner of 3 products with a brand logo","Mid-funnel discovery and brand lift. Needs Brand Registry."],
["Sponsored Display (SD)","Product-targeted ads on and off Amazon","Retargeting, competitor pages, audiences. Needs Brand Registry."]
]},
{t:"p",x:"This course focuses on Sponsored Products, because that is where 80%+ of beginner spend happens. Sponsored Brands and Display are extensions, not the starting point."},
{t:"tip",x:"Match the ad type to the objective, not to your skill. Beginners start with SP because it is the most controllable and has the lowest setup barrier."}
]},
{id:"m1l3",title:"Retail-Readiness Checklist",mins:7,blocks:[
{t:"goal",x:"Score a product's retail readiness and decide whether PPC pressure is safe before you turn on a campaign."},
{t:"p",x:"PPC does not create demand. It borrows demand that already exists on Amazon and steers it to a listing. If the listing is not ready to convert that borrowed demand, every click you buy is a small loan with no repayment: money leaves, no sale arrives. The retail-readiness checklist is the simple scorecard you run before you spend anything."},
{t:"p",x:"The reason readiness matters more than bid strategy is the auction math. Amazon charges you for every click, but only a fraction of clicks become orders. If your listing converts 2% of clicks and your competitor's converts 8%, the competitor pays four times your CPC and still walks away with more profit. The auction is not a bid contest — it is a profitability contest, and the listing does most of the work."},
{t:"table",head:["Item","What a pass looks like","What a fail looks like"],rows:[
["Title","Reads naturally. Main keyword in the first 60 characters. Clear size, count, or use case in the first 90.","Buried under symbols (®, ™, ‼), vague ('Best Thing Ever'), or stacks 5 keywords and reads like a search-term dump."],
["Images","7+ images. Pure white main image, 1500×1500 minimum, plus 3+ lifestyle or scale images.","3 images or fewer, low resolution, lifestyle missing, or the main image is not pure white (it gets suppressed)."],
["Price","Within ±15% of the median for the category at this quality tier.","Far above every comparable offer, or far below (which signals low quality and tanks conversion)."],
["Inventory","14+ days of cover at current sales velocity, with restock confirmed.","Under 7 days of cover, going out of stock in the next reorder, or already stockout-suppressed."],
["Buy Box","Owned, with 95%+ of recent orders routed to you.","Shared with no control, suppressed, or 0% Buy Box for the past week."],
["Reviews","4.0+ stars, 25+ reviews, with the most recent reviews in the past 90 days.","Below 4.0, fewer than 10 reviews, or the most recent batch is 1–2 stars."],
["Parent ASIN / variations","Listed under a parent with healthy siblings (the page has more to buy).","Standalone ASIN, or a parent whose siblings are all stockout-suppressed."],
["Brand & content","Brand Registry active, A+ Content live (if registered), and a working brand store.","No brand story, no A+, no store, or all three are placeholders."]
]},
{t:"p",x:"Score each row as Pass, Watch, or Fail. Watch means 'it works but it is fragile' — a 3.8-star average, 4 days of cover, or a price sitting 16% above the median. Fail means 'do not turn on ads yet'."},
{t:"example",x:"Bamboo Cutting Board, your first test product. Title: 'Bamboo Cutting Board, Large 16×12 with Deep Juice Groove, Eco-Friendly' — Pass (keyword front, attributes clear, no symbol spam). Images: 8, with a pure white main and 5 lifestyle shots — Pass. Price: $24.99, median for the category is $22–28 — Pass. Inventory: 9 days of cover, restock 12 days out — Watch (Fail in 2 weeks if restock slips). Buy Box: 100% owned — Pass. Reviews: 4.6 stars, 312 reviews, most recent 5 days ago — Pass. Parent: 3 sibling sizes, all in stock — Pass. Brand: not registered, no A+ — Watch. Result: 6 Pass, 2 Watch, 0 Fail. Safe to spend up to ~$30/day while you fix the inventory and brand content. Do not push to $100/day until the inventory and brand are Pass."},
{t:"formula",f:"If any row is Fail → fix it before spending. If two or more rows are Watch → cap daily budget at $20–30 until they harden. If all rows are Pass → you can scale with confidence.",note:"The checklist is a gate, not a wishlist. A 'Watch' is permission to spend carefully, not permission to scale."},
{t:"mistake",items:[
"Scoring the listing on vibes instead of the rows ('It looks fine to me' is not a Pass)",
"Treating price as the only readiness signal — a great price on a 3.5-star listing still loses money to a slightly worse price on a 4.6-star listing",
"Ranking the most 'fixable' Fail as a Pass because you plan to fix it next week (the fix is not in the account yet; the check has to be honest)",
"Running ads on a stockout-suppressed ASIN 'just to keep the data warm' — there is no data to keep, and Amazon's quality score drops the listing further"
]},
{t:"tip",x:"Run the checklist on three ASINs from your training data this week. Score each honestly. For every Fail, write a one-sentence fix. The fix is your first project; the ads come after."}
]},
{id:"m1l4",title:"Paid, Organic, and the Buy Box",mins:6,blocks:[
{t:"goal",x:"Explain organic vs paid sales, what the Buy Box is, and why PPC feeds both."},
{t:"p",x:"Organic sales are sales the listing earns on its own — usually because of good rank, reviews, and relevance. Paid sales are sales the listing earns because an ad was clicked. Total sales is the sum."},
{t:"p",x:"The Buy Box is the box on a product page that says 'Add to Cart'. Most ads assume the seller owns the Buy Box. If the seller does not own it, clicks are wasted — there is no Buy Box to add to."},
{t:"tip",x:"Ads buy visibility. The listing earns the sale. The best PPC work makes the listing more visible to the right shoppers, so organic and paid both grow."},
{t:"split",a:{title:"Do",items:["Track total sales, not just ad sales","Check the Buy Box first when something is off"]},b:{title:"Don't",items:["Read ACOS as a verdict on the listing","Run ads on a product without Buy Box ownership"]}}
]},
{id:"m1l5",title:"Lab: Shopper Journey and Readiness Audit",mins:5,blocks:[
{t:"goal",x:"Map a shopper from search to purchase and score a product's readiness."},
{t:"p",x:"Trace a shopper: types a search → sees search results → clicks an ad or organic result → lands on a product page → reads, scrolls, looks at reviews → adds to cart → checks out. Every step leaks shoppers; ads buy traffic into the top of the funnel, the listing converts them at the bottom."},
{t:"example",x:"Bamboo Cutting Board. A shopper searches 'bamboo cutting board'. Sees search results. Clicks an ad. Lands on the listing. Sees 4.6 stars and 200+ reviews. Adds to cart. PPC bought the click, the listing earned the cart."},
{t:"tip",x:"Run the retail-readiness checklist on one ASIN in your account or training data. If any line is a fail, that is your first project before you touch any campaign."}
]}
],
quiz:[
{q:"Why start with retail readiness?",o:["It is required by Amazon","PPC cannot fix a weak offer","Listings are easier to change","It improves ad reach"],a:1,e:"Ads buy visibility, the listing earns the sale."},
{q:"The Buy Box is…",o:["An ad placement","The Add-to-Cart area on a product page","A keyword research tool","A bid"],a:1,e:"If you do not own it, clicks are wasted."},
{q:"Sponsored Products are best for…",o:["Brand lift","Single-product promotion in search and on product pages","Retargeting","Off-Amazon display"],a:1,e:"SP is the default starting ad type."}
]},

{title:"PPC Language, Metrics, and Math",icon:"💰",color:"#0EA5E9",img:IMG.coach,desc:"Clicks, sales, ACOS, ROAS, and the danger of small samples.",
lessons:[
{id:"m2l1",title:"Pay Per Click in Plain Words",mins:5,blocks:[
{t:"goal",x:"Explain the basic flow of a PPC click and the metric terms that follow it."},
{t:"p",x:"PPC stands for pay-per-click. The seller does not pay to show an ad — showing an ad is free. The seller pays only when a shopper clicks. This is the only fact that makes PPC different from every other kind of advertising, and it is the only fact you need to remember about the name."},
{t:"p",x:"The full chain, in five steps: an ad appears (impression, free), a shopper clicks (the seller pays), the shopper lands on the product page, the shopper adds to cart, the shopper buys. Three of those five steps are free; two cost money. The cost is the click and, downstream, the fee Amazon takes on the sale. Everything a PPC manager does is about making the click and the sale happen at a price the seller can afford."},
{t:"p",x:"The seller sets a maximum bid — the most they are willing to pay for a click, in theory. The actual cost is almost always lower, because the ad auction clears below the bid. A $1.00 bid often produces a $0.40 click. The bid is a ceiling, not a price. New managers tend to set their bid too high because they read it as a price; experienced managers set the bid above their target CPC and let the auction find the floor."},
{t:"example",x:"Bamboo Cutting Board again. Bid set at $1.20. The ad shows 8,400 times this month, free. Shoppers click it 168 times (2% CTR). On the auction, the second-highest competitor was bidding $0.85 with weaker relevance, so the seller paid $0.62 per click on average. Total spend: 168 × $0.62 = $104.16. The $1.20 bid never mattered — it was the ceiling, not the price."},
{t:"formula",f:"Spend = Clicks × Actual CPC. Actual CPC ≤ Bid. Bid is a ceiling; the auction sets the real price.",note:"ACOS and ROAS use Spend and Sales. Both flow from clicks × CPC. Get CPC right and everything else is math."},
{t:"mistake",items:[
"Reading a high bid as 'I will pay this much' — you almost never will, because the auction clears below the bid",
"Setting the bid equal to the target CPC — this leaves no headroom; the auction will eat into your target and you will overpay",
"Confusing the bid (a number you set) with the budget (a total you are willing to spend) — bid is per-click, budget is per-period",
"Calling PPC 'paying to show up' — you pay to be clicked, not to be seen"
]},
{t:"tip",x:"Open any Sponsored Products campaign in your training data. Find the bid column. Find the actual CPC column. Notice the gap. The gap is the auction working for you."}
]},
{id:"m2l2",title:"How the Auction Works",mins:6,blocks:[
{t:"goal",x:"Explain why two sellers with the same bid can pay different CPCs and reach different placements."},
{t:"p",x:"Amazon runs a second-price auction, but it is not a pure second-price auction — it is a second-price auction multiplied by a quality factor. The highest bidder wins, but the price they pay is just enough to beat the second-place bidder, scaled by how relevant the ad and listing look to Amazon. This means three things at once: bid matters, relevance matters, and you do not know in advance which will dominate on a given search."},
{t:"p",x:"The quality factor is a number Amazon computes from your ad's historical performance and your listing's perceived quality. Amazon does not publish the formula, but the inputs are well-known: click-through rate, conversion rate, image quality, review count, review rating, and whether the search term matches the title and bullets. A new ad starts with a neutral score; it earns relevance by performing well on the search terms it gets shown for. Relevance compounds. A week of strong CTR on a search term improves your score, which lowers your CPC, which improves placement, which keeps CTR strong."},
{t:"list",items:[
"Relevance score: how well your ad and listing match the search term. The most controllable input.",
"Historical performance: past CTR and CVR on the same or similar searches. New ads start fresh.",
"Listing quality: images, title, bullets, price, reviews. Affects both the auction and the post-click conversion.",
"Ad type and placement: top of search costs more than product pages; SP costs less than SB; video costs differently from text."
]},
{t:"example",x:"You and a competitor both bid $1.00 on 'bamboo cutting board large'. Your CTR is 2.4%; theirs is 0.9%. Amazon's auction sees you as the better clicker and lowers your effective CPC. You win the top placement and pay $0.61 per click. The competitor, with the same bid, pays $0.89 and lands in slot 3. Same bid, very different outcome. Quality won."},
{t:"formula",f:"Effective CPC = (Second-highest bid ÷ Your quality score) × 100. Higher quality score = lower actual CPC.",note:"Quality is not just an abstract number. Every CTR and CVR point you improve lowers your real cost."},
{t:"mistake",items:[
"Believing the highest bid always wins — it does not, because the quality factor multiplies in",
"Chasing a higher bid to fix a low-placement problem when the real problem is a weak listing or a poor CTR history",
"Stopping the campaign to 'reset' a bad relevance score — this also resets any accumulated quality, and you will start over from zero",
"Reading a low CPC as a sign of a good campaign — low CPC with zero conversions is a quiet, expensive failure"
]},
{t:"tip",x:"If a campaign is overpaying, do not raise the bid first. Check the listing quality, then the search-term relevance, then the historical CTR. The bid is usually the last dial to touch."}
]},
{id:"m2l3",title:"Spend, Sales, CPC, CTR, Conversion",mins:7,blocks:[
{t:"goal",x:"Compute the core traffic and conversion metrics and know what each one proves on its own."},
{t:"p",x:"Every PPC report is built from three counts: spend, sales, and the number of clicks and impressions between them. The metrics are ratios of those counts, and each ratio answers exactly one question. The trap is treating them as a single score. CTR, CVR, and ACOS each measure a different link in the chain; a metric can be great while the business loses money, and a metric can be bad while the business is healthy."},
{t:"p",x:"The chain in order: an impression is a chance to be seen; CTR is how often that chance turns into a click; the click costs CPC × Clicks in spend; CVR is how often a click becomes an order; the order is the sale. Reading the chain left to right, a problem anywhere stops everything to the right of it. Reading it right to left, sales is what matters, and every other metric exists to explain why sales is what it is."},
{t:"formula",f:"CPC = Spend ÷ Clicks",note:"Average paid per click. Lower is not always better — cheap clicks with no sales lose money. Always read CPC alongside CVR."},
{t:"formula",f:"CTR = Clicks ÷ Impressions × 100",note:"How often viewers click your ad. Hook signal. A low CTR means the ad creative, the price, or the relevance is not earning the click."},
{t:"formula",f:"CVR = Orders ÷ Clicks × 100",note:"How often a click becomes an attributed order. Listing-quality signal. A low CVR with a strong CTR is a listing problem, not an ad problem."},
{t:"diagram",kind:"funnel",title:"The click funnel",items:[["Impressions",100],["Clicks",20],["Add to cart",4],["Orders",2]]},
{t:"mistake",items:[
"Reading a CTR drop as a CVR problem — they are different steps; diagnose the step that moved",
"Optimizing CTR to 10% on a search term that never converts — you have built a leaky bucket",
"Comparing CTR across placements without adjusting for position bias — top-of-search CTR is naturally higher",
"Treating CPC as 'the cost of the bid' — CPC is the result of the auction, not the bid you set"
]},
{t:"tip",x:"When a number goes wrong, walk the chain left to right. Where did the line break? Then fix that step. Don't 'lower the bid' when the actual problem is a weak listing converting at 3%."}
]},
{id:"m2l4",title:"ACOS, ROAS, TACoS, and Break-Even",mins:8,blocks:[
{t:"goal",x:"Compute ACOS, ROAS, TACoS, and break-even ACOS, and know what each metric can and cannot tell you."},
{t:"p",x:"ACOS, ROAS, and TACoS are three ratios of the same two numbers — ad spend and ad sales — but they answer different questions. ACOS asks 'is the ad profitable on its own?'. ROAS asks the same question inverted: 'how many dollars back per ad dollar?'. TACoS asks 'are ads lifting the whole business, including organic sales?'. The most common PPC mistake is to pick one of these as 'the' metric and ignore the others."},
{t:"p",x:"The fourth number — break-even ACOS — is the most important one and the most often skipped. Break-even ACOS is your pre-ad contribution margin, expressed as a percentage. It is the highest ACOS you can run at without losing pre-ad profit on the attributed sales. A product with 30% contribution margin has a 30% break-even ACOS; running at 25% ACOS is profitable, running at 40% is not. The break-even line is the only line that actually matters, and it is unique to each product."},
{t:"formula",f:"ACOS = Ad Spend ÷ Ad Sales × 100",note:"Ad spend as a percentage of ad revenue. Compare to your margin, not to a target number. A 25% ACOS is great at 40% margin and a disaster at 10% margin."},
{t:"formula",f:"ROAS = Ad Sales ÷ Ad Spend",note:"Dollars back per ad dollar. ROAS = 1 ÷ ACOS. ACOS of 25% means ROAS of 4.0. Same information as ACOS, different shape."},
{t:"formula",f:"TACoS = Ad Spend ÷ Total Sales × 100",note:"Ad spend relative to total revenue. Shows whether ads are lifting the whole business, including organic. Falling TACoS at stable spend is growth; rising TACoS at stable spend is dependency."},
{t:"formula",f:"Break-even ACOS = Pre-ad contribution margin × 100",note:"The maximum ACOS before ads consume pre-ad profit. 30% margin = 30% break-even ACOS. Above this line, every sale loses money before overhead."},
{t:"table",head:["Metric","Formula","What it proves","What it does NOT prove"],rows:[
["ACOS","Spend ÷ Ad Sales","Whether ad sales are profitable on their own","Whether the product is profitable overall, or whether organic is paying the bills"],
["ROAS","Ad Sales ÷ Spend","How many dollars back per ad dollar","Anything beyond the per-ad-dollar return"],
["TACoS","Spend ÷ Total Sales","Whether ads lift the whole business, organic included","Whether the ad sales themselves are profitable"],
["Break-even ACOS","Margin × 100","The ACOS ceiling for profitability","What the right bid or budget should be — that is a separate decision"]
]},
{t:"example",x:"Bamboo Cutting Board: $24.99 price, $9.00 landed cost, $3.75 referral fee, $2.50 FBA fee. Pre-ad margin = $24.99 - $15.25 = $9.74, or 39%. Break-even ACOS = 39%. The campaign is at 28% ACOS. Profitable by 11 points. If margin drops to 25% next year (new FBA rates), break-even is 25% and the same campaign is now unprofitable. The line moves; the campaign does not need to."},
{t:"mistake",items:[
"Targeting an 'ACOS under 20%' across the board — this is not a real target, it is a vanity number, and it depends on margin",
"Reading TACoS as 'ACOS for the business' — TACoS includes organic sales and so falls as a business grows even with the same ACOS",
"Confusing break-even ACOS with profit — running at break-even ACOS means zero contribution from ads, not profit",
"Lowering ACOS by pausing profitable keywords — the campaign looks better on paper while the business loses volume"
]},
{t:"tip",x:"Before changing a bid or budget, write down the product's pre-ad margin and the break-even ACOS. If your current ACOS is below it, the dial to turn is growth, not efficiency."}
]},
{id:"m2l5",title:"Attribution Windows and Leading vs Lagging",mins:6,blocks:[
{t:"goal",x:"Explain why two reports show different numbers, and which metrics are leading versus lagging."},
{t:"p",x:"An attribution window is the period during which a click can be 'credited' for a sale. For Sponsored Products, the standard window is 7 days: if a shopper clicks your ad today and buys the same product six days later, that sale is attributed to today's click. Different ad types have different windows, and reports can be filtered to narrower windows. This is why the same campaign can show different sales numbers in two different reports."},
{t:"p",x:"Leading indicators change fast. Impressions, clicks, and CTR respond within hours — they reflect what shoppers are doing today and what the auction is doing right now. Lagging indicators change slowly. Sales, orders, ACOS, and TACoS depend on the attribution window closing and on shopper behavior over days. A campaign you turned off this morning may still produce attributed sales for the next week. A campaign you turned on this morning will look weak for the next week even if it is performing well today."},
{t:"split",a:{title:"Trust the lagging",items:[
"Sales, orders, and ACOS at 7+ days",
"Comparing week-over-week and month-over-month",
"Break-even and margin-based decisions",
"Diagnosing a 4-week trend"
]},b:{title:"Use the leading",items:[
"Impressions, clicks, CTR inside a day",
"Diagnosing a sudden traffic drop or spike",
"Bid changes — see if the auction responded",
"Budget pacing — did the campaign serve all day?"
]}},
{t:"mistake",items:[
"Reading day-1 ACOS as 'this is how the campaign is doing' — it is how the campaign is doing today, and today is the noisiest day",
"Comparing today's sales to last week's — the windows don't match",
"Turning off a campaign on day 2 because sales look weak — the 7-day window hasn't closed yet",
"Trusting real-time reports for budget decisions — they undercount everything that hasn't closed the window"
]},
{t:"tip",x:"For every decision, ask: 'Is this a leading or lagging metric?'. If the answer is leading, use it for diagnosis only. If the answer is lagging, use it for action."}
]},
{id:"m2l6",title:"Data Sufficiency: Don't Decide from Tiny Samples",mins:6,blocks:[
{t:"goal",x:"Recognize when a data sample is too small to support a confident decision, and what to do instead."},
{t:"p",x:"A search term with 3 clicks and 1 sale is not 'profitable'. It is 3 clicks. A campaign with 200 impressions and no sales is not 'failing'. It is too early. The smallest samples produce the loudest stories, and PPC dashboards happily display them as if they were facts. Acting on tiny samples is the single most common way new managers wreck an account."},
{t:"p",x:"The fix is a confidence rule: how many clicks do you need before a number is real? There is no universal answer, because search volume and conversion rate both vary by category. But a workable rule of thumb: under 10 clicks, the number is noise; 10–30, it is a signal worth watching but not yet worth acting on; 30+, it is a trend you can trust; 100+, it is a fact about that target. The same rule applies to impressions for CTR: a 4% CTR on 25 impressions is not the same statement as a 4% CTR on 2,500."},
{t:"table",head:["Sample size","Confidence","Action"],rows:[
["Under 10 clicks","Low","Watch. Don't act. Note the search term, leave the campaign alone."],
["10–30 clicks","Medium","One careful change. Give it a week before the next change."],
["30+ clicks","High","Trust the trend. Act on it: pause, bid, harvest, restructure."],
["100+ clicks","Very high","Treat as a fact about that target. Build your strategy around it."]
]},
{t:"example",x:"A new search term 'eco bamboo board' shows 3 clicks, 1 sale, ACOS 22%. It looks like a winner. The next 30 clicks: zero sales, ACOS 84%. The 22% was a fluke on a tiny sample. With 33 clicks, the real ACOS settles near 70% and the term gets paused. A manager who acted on the 3-click number would have scaled into a loss."},
{t:"mistake",items:[
"Pausing a search term on 2 clicks because it has not converted — it has not had a chance yet",
"Promoting a search term on 1 sale out of 3 clicks — that 1 sale is a sample of one, and a sample of one is not a trend",
"Changing bids daily because the numbers move — daily moves are noise on small samples",
"Reporting ACOS to a client from 48 hours of data — the window hasn't closed"
]},
{t:"tip",x:"When in doubt, give it one more week. Under-reacting beats over-reacting in PPC, because the cost of waiting a week is small and the cost of acting on noise is real money."}
]}
]},
quiz:[
{q:"If margin is 25%, break-even ACOS is…",o:["75%","25%","50%","10%"],a:1,e:"Break-even ACOS equals the margin."},
{q:"Which is a lagging indicator?",o:["Impressions","Clicks","ACOS","CTR"],a:2,e:"Sales and ACOS need 7+ days to settle."},
{q:"10 clicks on a search term is enough to…",o:["Pause the campaign","Trust the ACOS completely","Decide cautiously, give it a week","Negate it"],a:2,e:"Small samples create loud lies."}
]},

{title:"Campaign Structure and Naming",icon:"🏗️",color:"#10B981",img:IMG.builder,desc:"The hierarchy, naming standards, portfolios, and budget isolation.",
lessons:[
{id:"m3l1",title:"The Hierarchy: Campaign, Ad Group, Targeting",mins:6,blocks:[
{t:"goal",x:"Trace any target back to its campaign, ad group, and product, and explain what lives at each level."},
{t:"p",x:"Amazon's Sponsored Products structure is a tree with three levels. The campaign is the trunk — it holds the budget, the bid strategy, the placements you allow, the start and end dates. The ad group is a branch — it groups products with shared targeting, so all of them get the same keyword or product target. The target is the leaf — the actual keyword or ASIN you are bidding on. A shopper never sees any of this; it is purely how you organize the work."},
{t:"p",x:"The cardinal rule: one target lives in exactly one place at a time. If the same keyword exists in two ad groups inside two campaigns, the auction still produces one ad, but you have split your own data, and you will not be able to tell which campaign the sale came from. The new manager's first instinct is to 'be safe' and add the same keyword to a second campaign. The right instinct is to keep it in one place, watch the data, and graduate it when ready."},
{t:"diagram",kind:"tree",title:"Sponsored Products hierarchy",nodes:[
[0,"Campaign (budget, bid strategy, placements)"],
[1,"Ad group A (products 1, 2, 3 — same targeting)"],
[2,"Keyword 'bamboo board' · Bid $0.80 · Match Exact"],
[2,"Product A · Bid by keyword"],
[2,"Product B · Bid by keyword"],
[1,"Ad group B (products 4, 5 — different targeting)"],
[2,"Product 'eco kitchen' · Bid $0.95 · Match Phrase"]
]},
{t:"example",x:"Bamboo Cutting Board lives in one campaign, in one ad group, alongside other kitchen SKUs, targeting 'bamboo cutting board' on Exact. If you later want to bid a higher amount for the hero SKU only, that hero gets its own ad group inside the same campaign — same budget, same placements, separate bid control. If you want a separate budget for research, that goes in a different campaign."},
{t:"mistake",items:[
"Duplicating the same keyword across two campaigns to 'double the chance' — you don't, and you split the data",
"Putting unrelated products in the same ad group because they share a theme — same theme does not mean same targeting, and you cannot bid them differently",
"Treating the campaign as 'just a folder' — campaign-level settings (budget, placements, strategy) apply to every ad group inside it, and you cannot set them per ad group",
"Adding a new ad group for a single new product when the existing ad group has room — every ad group is overhead, and the structure should earn its keep"
]},
{t:"tip",x:"If you cannot draw the tree on paper in 60 seconds, the structure is too messy to optimize. A clean account is one you can sketch from memory."}
]},
{id:"m3l2",title:"Naming and Organization",mins:5,blocks:[
{t:"goal",x:"Build a naming standard that survives three months from now, when you have forgotten why you made the choices you made."},
{t:"p",x:"A name has one job: tell you what a campaign is without opening it. Three months from now, you will have 40 campaigns, you will be tired, and you will not remember which 'BCB-Exact-v2' was the working one. The name should answer four questions, in this order: ad type, match type, product, and purpose. Use a separator — pipe, dash, underscore — so each piece is searchable and parseable."},
{t:"example",x:"SP | Exact | BambooBoard | LongTail. Three months later, you can filter by SP, by Exact, by BambooBoard, or by LongTail, in any order. Each piece means something."},
{t:"split",a:{title:"Do",items:[
"Use pipes or dashes as separators",
"Keep product codes short — 'BCB' or 'BambooBoard', not 'bamboo_cutting_board_SKU_3'",
"Document the convention somewhere your team can read",
"Use the same convention across markets (US, UK, CA) — change the prefix for the market, not the structure"
]},b:{title:"Don't",items:[
"Use 'final_final_v3' or anything that tells you about the past instead of the present",
"Use dates in the name — campaigns live for months; the date lies",
"Use the same name across two markets — they will be merged in your mental model and produce silent mistakes",
"Rename campaigns on a whim — your old naming is in old reports; pick a standard and hold it"
]}},
{t:"table",head:["Position","Means","Example"],rows:[
["1","Ad type","SP, SB, SD"],
["2","Match type","Exact, Phrase, Broad, Auto, Product"],
["3","Product or line","BambooBoard, KitchenKnife, PhoneCase-X"],
["4","Purpose","LongTail, Hero, Research, Defense, Brand"]
]},
{t:"tip",x:"Pick a standard, write it down, and never rename a campaign to fix a bad name — pause it and create a new one with the right name. Old names are in old reports."}
]},
{id:"m3l3",title:"One-ASIN vs Multi-ASIN, Portfolios, Cannibalization Myths",mins:6,blocks:[
{t:"goal",x:"Decide when to use a one-ASIN campaign, when to combine, and when a portfolio earns its complexity."},
{t:"p",x:"A one-ASIN campaign is a single product in its own campaign. The data is clean, the bid is surgical, the report tells you one story. A multi-ASIN campaign is several products in one campaign, sharing budget and targeting. The data is mixed, the bid is average, the report tells you a story with a chorus. Beginners should default to one-ASIN because the data is the only thing they have, and clean data is worth more than saved clicks. Multi-ASIN earns its keep when the SKUs are close in margin, close in performance, and you have learned what each one does alone."},
{t:"p",x:"Portfolios are folders that span campaigns, with shared reporting and budget controls. They are not folders in the file-system sense — they are a reporting layer above campaigns. Use them to group by objective (defense, growth, brand) or by product line (Kitchen, Phone Cases, Outdoor), so you can read performance at a higher level. The trap is creating a portfolio for every campaign because the UI lets you. Each portfolio should answer a question you actually ask — 'how is the kitchen line doing as a whole?' — not a question you will never ask."},
{t:"p",x:"Cannibalization between your own ads is the most over-diagnosed problem in PPC. Yes, if three of your campaigns are bidding $0.80, $1.20, and $0.40 on the same exact keyword, the auction picks one, and the other two are wasted spend. Yes, that is real. But beginners see this and panic — they think any two ads on the same keyword is a problem. It is not. Cannibalization only matters when the bids are meaningfully different and the spend is meaningful enough to recover. Until you have three campaigns on the same term with conflicting bids, do not optimize for cannibalization. Optimize for scale."},
{t:"split",a:{title:"Default to one-ASIN when",items:[
"You are learning — clean data beats efficiency",
"Margins differ a lot between SKUs",
"The hero product deserves surgical bid control"
]},b:{title:"Use a portfolio when",items:[
"You want to read performance at a product-line level",
"You have 5+ campaigns on the same objective",
"You need a shared budget cap across campaigns"
]}},
{t:"mistake",items:[
"Defaulting to multi-ASIN to 'save time' — the time you save at setup you spend forever in confused reports",
"Creating a portfolio per campaign — the portfolio layer should compress signal, not duplicate it",
"Panicking about cannibalization on day 3 — wait for meaningful overlap with conflicting bids",
"Putting SKUs with different margins in one campaign — a single bid cannot serve both"
]},
{t:"tip",x:"One-ASIN campaigns are the boring default that wins. The fancy structure you can build later; the clean data you need now."}
]},
{id:"m3l4",title:"Budget Isolation and Match-Type Separation",mins:7,blocks:[
{t:"goal",x:"Use match-type separation and budget isolation to keep the data clean and the campaigns from competing with themselves."},
{t:"p",x:"Match-type separation means running one campaign per match type for a given product: one Broad, one Phrase, one Exact. The reason is data, not aesthetics. When all three match types share a campaign, the auction picks one, the report shows a single row per keyword, and you cannot tell which match type produced the click. With three campaigns, each match type has its own row, its own CPC, its own CTR, its own CVR, and you can tune each one independently. Beginners do not need this. As soon as spend is meaningful, they do."},
{t:"p",x:"Budget isolation is the same principle one level up: each campaign's job gets its own dollars. The Exact-winner campaign has its own budget, and the Broad-research campaign has its own smaller budget, and they do not compete for the same pool. The reason is that Broad eats money; if Broad and Exact share a budget, Broad wins on most days because Broad is broader, and Exact is starved. When Exact is starved, your proven terms are not serving, and your profitable keywords are not getting the impressions they have earned."},
{t:"table",head:["Separation","What it solves","When you need it"],rows:[
["Match type","Which match type is performing","As soon as you have data worth reading"],
["Product","Different margins need different bids","When two SKUs share a campaign but not a margin"],
["Purpose","Research spends without starving winners","From day 1 if research and performance share a budget"]
]},
{t:"formula",f:"Without separation: ACOS_aggregate = (sum spend) / (sum sales). One number, no story.",note:"With separation: ACOS_exact, ACOS_phrase, ACOS_broad. Three numbers, three decisions."},
{t:"example",x:"Bamboo Cutting Board has 200 sales a month from PPC. You run one campaign, $400/day, all match types. After 30 days, ACOS is 32%. Looks fine. But inside the report, the 5% of clicks from Exact are doing 18% ACOS, and the 60% from Broad are doing 47% ACOS. You cannot see this from one campaign. Split it into three, and now you know to cut the Broad budget and double the Exact bid."},
{t:"mistake",items:[
"Mixing match types in one campaign when spend is over a few hundred a day — you are losing signal",
"Sharing a budget between research and performance — research always wins, performance is starved",
"Adding a new match-type campaign without a budget — it will inherit, and steal from the others",
"Believing separation is overhead — separation is the only way to read the data clearly"
]},
{t:"tip",x:"If a Broad campaign is eating 80% of the budget and your Exact campaign is starved, the data is telling you the bid is too high on Broad, or the budget is too small overall. Either lower Broad or raise the total. Don't leave them sharing."}
]},
]},
quiz:[
{q:"Match-type separation means…",o:["One campaign per match type","All match types in one ad group","No match types","Negatives only"],a:0,e:"Separation keeps the data clean per match."},
{q:"A good campaign name answers…",o:["The date only","Ad type, match, product, purpose","The budget","The CPC"],a:1,e:"A name should make the campaign self-explanatory."},
{q:"A portfolio is best for…",o:["Hiding campaigns","Grouping campaigns by objective or product line","Increasing bids","Replacing ad groups"],a:1,e:"Portfolios are folders for shared reporting and budget views."}
]},

{title:"Keyword Research and Search Intent",icon:"🔍",color:"#8B5CF6",img:IMG.lab,desc:"Seed keywords, modifiers, intent, clustering, and Brand Analytics.",
lessons:[
{id:"m4l1",title:"Keyword vs Search Term",mins:5,blocks:[
{t:"goal",x:"Tell keywords from search terms, and explain why the distinction is the most important data concept in PPC."},
{t:"p",x:"A keyword is a word or phrase that you target. A search term is what the customer actually typed into the search bar. You set the keyword; the customer types the search term; Amazon matches them inside the auction. The keyword is your hypothesis about what shoppers will type. The search term is the reality of what they typed. Most of the work in PPC is the gap between those two things."},
{t:"p",x:"The search-term report shows every search term that triggered your ad, how many clicks it produced, what it cost, and whether it converted. This is the only report that tells you what shoppers really typed. Beginners optimize the keyword view (their own targeting); experienced managers optimize the search-term view (the customer's reality) and use it to update the keyword view. The lesson inside this lesson: a manager who never opens the search-term report is managing a guess."},
{t:"table",head:["","Keyword","Search term"],rows:[
["Who decides","You","The customer"],
["What it is","Your targeting","Their actual query"],
["Where to see it","Campaign view","Search-term report"],
["Changes","When you edit","Every minute"]
]},
{t:"example",x:"You target the keyword 'bamboo cutting board large' on Phrase. The search-term report shows: 'bamboo cutting board large' (12 clicks, 4 sales), 'large bamboo cutting board set' (3 clicks, 0 sales), 'bamboo chopping board' (8 clicks, 1 sale), 'cutting board wood' (1 click, 0 sales). Three of those four terms are variants; one is unrelated. The keyword view would have shown you one row; the search-term report shows you four."},
{t:"mistake",items:[
"Optimizing the keyword view and never opening the search-term report — you are managing a guess",
"Reading the keyword's CVR instead of the search term's CVR — they can differ by 5x",
"Confusing the search-term report with the keyword report — the search-term report is downstream of the keyword report, and you need both",
"Trusting the suggested keywords panel as a verdict — it is a starting point, not a final list"
]},
{t:"tip",x:"The search-term report is where the truth lives. The keyword view is where the intent lives. Read both, in that order, every week."}
]},
{id:"m4l2",title:"Match Types Deep Dive",mins:7,blocks:[
{t:"goal",x:"Pick the right match type for the job, and explain what 'Exact' actually means on Amazon."},
{t:"p",x:"Match types are the most-misunderstood control in PPC. The common belief is that 'Broad is loose, Phrase is medium, Exact is strict', and this is roughly true. The common mistake is reading 'Exact' as a literal character-for-character match. Amazon's Exact is a tight match with close variants: plurals, common misspellings, related stems, and — controversially — some interpretive matches the system thinks are equivalent. A single keyword in Exact is rarely tight enough for a serious product. The right pattern is one keyword per Exact, with negatives around it."},
{t:"p",x:"Broad is the loosest match Amazon allows. It will trigger on close variants, related phrases, and anything Amazon's system considers similar to your keyword. This is exactly what you want during discovery and exactly what you do not want during scale. Phrase is in between: the customer's phrase must contain your phrase, in any order, with words before or after. Phrase is the workhorse match type for a mid-funnel campaign. Exact is for control. The trap is to start with Exact because it sounds safe; with no data, Exact is also blind, and you will learn slowly."},
{t:"table",head:["Match","Behavior","Use it for","Don't use it for"],rows:[
["Broad","Includes close variants, loose order, plurals, related phrases","Discovery, initial research, ongoing horizon-scanning","Control, scale, profit-targeting"],
["Phrase","Customer's phrase must include your phrase; words in any order outside","Mid-funnel, learning the customer's exact wording","Proven winners where you need surgical bids"],
["Exact","Customer's phrase is a tight match with close variants","Proven winners, scale, surgical bid control","Discovery, learning, or any term with fewer than 30 clicks"]
]},
{t:"example",x:"Keyword 'bamboo cutting board' on Exact. Shoppers searching 'bamboo cutting board large' or 'bamboo cutting board set' may still match — close variants, same intent. A shopper searching 'chopping board' will not match — different phrase, different intent, even if it means the same thing. Exact is tight, not strict. Treat it as 'I trust this keyword to convert; I am willing to pay more for it than I would for a guess.'" },
{t:"formula",f:"Reach: Broad > Phrase > Exact. Control: Exact > Phrase > Broad. Cost per click: Exact > Phrase > Broad. Match type is a dial, not a switch.",note:"Pick by data state, not by default. No data = Phrase. Some data = Phrase + Exact winners. Lots of data = Exact + small Broad for discovery."},
{t:"mistake",items:[
"Believing Exact is character-for-character — it is a tight match with variants, and you need negatives around it",
"Starting on Exact with no data — you will be right, slowly, instead of wrong, fast",
"Running Phrase and Broad at the same bid as Exact — the bid should reflect the risk of each match type",
"Skipping negatives around Exact — the variants that match Exact are also your main waste source"
]},
{t:"tip",x:"No data: Phrase. Some data: Phrase + Exact on the winners. Lots of data: Exact + a small Broad campaign for ongoing discovery. Match type is a dial, not a switch."}
]},
{id:"m4l3",title:"Seed Keywords, Modifiers, Synonyms, Use Cases",mins:6,blocks:[
{t:"goal",x:"Build a 50-term seed keyword bank from product facts, and grow it from there with data, not guessing."},
{t:"p",x:"A seed keyword bank is the starting list you hand to Amazon's data before you have any search-term report to mine. It is built from product facts, not from search volume estimates. Name the product, name the material, name the size, name the use case, name the audience, name the problem it solves. Each fact is a seed direction. From each direction, generate 5-10 phrases. A 50-term list is the right size for a single product. Bigger lists come from data — from your own search-term report, from Brand Analytics, from competitor observation."},
{t:"p",x:"The mistake is to build a 500-term list from autocomplete and call it research. It is not. It is guessing at scale. The right way: 50 terms from product facts, run them, see what shoppers actually type, mine the search-term report for the terms that work, and grow the list from real data. The 50 becomes 80 becomes 200, and every term past 50 is earned, not invented."},
{t:"list",items:[
"Product name: 'bamboo cutting board', 'bamboo chopping board'",
"Material or attribute: 'bamboo', 'eco friendly', 'large', 'wooden', 'plastic-free'",
"Size or spec: 'large', 'small', 'set of 2', 'with handle'",
"Use case: 'for kitchen', 'for meat', 'for bread', 'for vegetables'",
"Synonyms: 'chopping board', 'serving board', 'butcher block', 'carving board'",
"Audience: 'for chefs', 'for small kitchens', 'gift for cooks'",
"Problem solved: 'eco friendly', 'plastic free', 'non toxic'"
]},
{t:"example",x:"Bamboo Cutting Board, large, 16x12, eco-friendly, gift-boxed. From product facts, a 50-term seed list: 'bamboo cutting board', 'bamboo chopping board', 'large cutting board', 'bamboo serving board', 'eco friendly cutting board', 'wooden cutting board', 'cutting board for meat', 'cutting board for bread', 'cutting board gift', 'butcher block bamboo', 'plastic free cutting board', 'non toxic cutting board', 'cutting board with handle', 'bamboo board set', 'large bamboo board'... The list is built from product truth, not from autocomplete."},
{t:"mistake",items:[
"Building a 500-term list from autocomplete and calling it research — it is guessing at scale",
"Shipping a 50-term list to a campaign without grouping by intent — you will mix intent, and the bid will lie",
"Skipping synonyms — shoppers call the same thing 4-5 different ways, and missing the synonym is missing the sale",
"Using the same seed list for two unrelated products — each product deserves its own seed"
]},
{t:"tip",x:"A 50-term keyword bank is the right starting size for a single product. Bigger lists come from data, not from guessing. Build the seed, then let the data grow it."}
]},
{id:"m4l4",title:"Volume vs Relevance, Brand Analytics, Clustering",mins:8,blocks:[
{t:"goal",x:"Prioritize relevance over estimated volume, use the right data sources, and cluster by intent."},
{t:"p",x:"Search volume tells you how many shoppers search. Relevance tells you whether they will buy your product. The two are not the same. A high-volume irrelevant term is more dangerous than a low-volume relevant one — it burns budget on clicks that will never convert. A 200-volume term that converts at 30% ACOS is worth 10x more than a 20,000-volume term that converts at 80% ACOS. Beginners optimize for volume because volume is the number Amazon shows first. Experienced managers optimize for relevance because relevance is the number that pays the rent."},
{t:"p",x:"The four data sources for keyword research, in order of trust: your own search-term report (the truth, because it is your data, on your product, with your conversion rate); Brand Analytics search-term and market-basket data (needs Brand Registry; aggregated, anonymized, and useful for top-of-funnel direction); competitor observation (look at the top 3 in the category and read their titles and bullets); Amazon autocomplete and 'related searches' (lowest trust, but free and always available). Your own data is the best predictor of your own future. Other people's data is a hint."},
{t:"p",x:"Cluster by intent, not by spelling. A cluster is a group of terms that mean the same thing to the shopper — a long cutting board, a gift, an eco option, a meat-specific board. The cluster gets a single bid, a single landing page (when possible), and a single performance review. Clustering by spelling ('all the ones with 'bamboo'') is wrong because it mixes intent. A 'bamboo cutting board large' and a 'bamboo cutting board gift' are different intents; they want different things, they convert differently, they deserve different bids."},
{t:"list",items:[
"Amazon suggestions: autocomplete and 'related searches' on the search page — free, lowest trust",
"Brand Analytics: search-term and market-basket data — needs Brand Registry, more trustworthy",
"Prior search-term reports: your own data — the best predictor of your own future",
"Competitor observation: top-3 titles, bullets, and any visible targeting — directional"
]},
{t:"table",head:["Cluster","Sample terms","Intent","Bid posture"],rows:[
["Long / large","bamboo cutting board large, big cutting board","Size intent","Mid bid, high volume"],
["Gift","cutting board gift, gift for cooks","Occasion intent","Mid bid, seasonal"],
["Eco","eco friendly cutting board, plastic free board","Value intent","Low to mid bid, niche"],
["Material","wooden cutting board, bamboo board","Attribute intent","Mid bid, broad match"]
]},
{t:"example",x:"A term with no estimated volume — 'bamboo board for charcuterie' — is not a useless term. If it shows in your search-term report with 2 sales and 5 clicks, it is real, it is converting, and it deserves its own bid. Estimated volume is a forecast; your own conversions are a fact."},
{t:"mistake",items:[
"Picking a high-volume irrelevant term because volume is the number Amazon shows first — relevance is the number that pays",
"Clustering by spelling instead of intent — the cluster needs to share an intent, not a substring",
"Trusting autocomplete as a complete list — autocomplete is what Amazon wants you to bid on, not necessarily what converts",
"Ignoring Brand Analytics because it is hard to read — it is one of the most underused, most accurate data sources"
]},
{t:"tip",x:"A term with no estimated volume is not a useless term. If it is in your search-term report with sales, it is real. Trust your own data over Amazon's forecast."}
]}
]},
quiz:[
{q:"A search term is…",o:["Your keyword","What the customer typed","A bid","A budget"],a:1,e:"Customer language, not yours."},
{q:"Exact match is…",o:["Character-for-character literal","A tight match with close variants","Random","Only plurals"],a:1,e:"Exact is tight, not strict."},
{q:"Prioritize…",o:["Volume over relevance","Relevance over volume","The longest keyword","Negatives first"],a:1,e:"High-volume irrelevant terms burn budget."}
]},

{title:"Automatic Targeting",icon:"🤖",color:"#EC4899",img:IMG.console,desc:"Four auto groups, bid segmentation, and reading the search-term report.",
lessons:[
{id:"m5l1",title:"The Four Auto Groups",mins:6,blocks:[
{t:"goal",x:"Name the four automatic-targeting groups, and explain what each one actually targets and what it is good for."},
{t:"p",x:"Amazon's automatic targeting is one campaign with four ad groups, each running on a different segment of shopper behavior. The four groups are Close match, Loose match, Substitutes, and Complements. They share the same product ads, but each group targets a different kind of shopper search. Treating them as one campaign is a mistake; treating them as four separate research streams is the right mental model."},
{t:"p",x:"Close match targets searches that are tightly related to your product — same category, same intent, often the same words. Loose match targets searches loosely related to your product — adjacent categories, nearby intent, often with different words but a similar shopper. Substitutes targets competitor products similar to yours — the shopper is on a competitor's page or searching a competitor's brand. Complements targets products that shoppers buy alongside yours — the shopper is on a complementary page, often in a different category."},
{t:"table",head:["Group","Targets","Shopper intent","Research value"],rows:[
["Close match","Tightly related searches","Looking for what you sell","High — close to your core"],
["Loose match","Loosely related searches","Open, comparing options","Medium — discovers adjacent intent"],
["Substitutes","Competitor products","Already on a competitor's page","High — competitive data"],
["Complements","Adjacent products","Already bought, considering more","Medium — cross-sell data"]
]},
{t:"example",x:"Bamboo Cutting Board. Close match fires on 'bamboo cutting board', 'wooden chopping board'. Loose match fires on 'kitchen cutting board', 'serving board'. Substitutes fires on searches for competitor brands and on competitor product pages. Complements fires on 'kitchen knife set', 'cutting board oil', 'chef's apron'. The four groups are not the same audience, and they are not the same value to you."},
{t:"mistake",items:[
"Setting all four groups at the same bid — each group has a different job and a different cost-per-click reality",
"Pausing the substitutes group because it 'looks competitive' — that is where the competitor's customers are",
"Reading zero impressions on complements as 'this group doesn't work' — it works for some products, not for others, and the first two weeks are the learning period",
"Treating auto as a finished campaign — auto is a research tool, not a destination"
]},
{t:"tip",x:"The four groups are four research streams. Read the search-term report for each one separately. The data will tell you which group deserves which bid."}
]},
{id:"m5l2",title:"Auto Bid Segmentation by Group",mins:6,blocks:[
{t:"goal",x:"Set a different bid for each auto group based on its job, and tune the bids as the data comes in."},
{t:"p",x:"The right starting bid structure for the four groups depends on your product's economics and the auction. A workable default: close match at your normal bid, loose match lower (looser intent, more waste), substitutes at the same level as close (the competitor's shopper is high-intent), complements low (cross-sell, lower intent, lower bid). Tune from there. The principle: each group gets the bid that reflects its risk and its reward."},
{t:"p",x:"The data will move the bids over time. After two weeks, look at the search-term report per group. If close and substitutes are producing sales at a healthy ACOS, raise those bids. If loose is burning money on irrelevant terms, lower it. If complements is silent, leave it low — it may be that your product has no complementary category, or it may be that the bid is too low to surface data. Either way, do not pause it yet; you are still learning."},
{t:"example",x:"Bamboo Cutting Board, default: close $0.80, loose $0.50, substitutes $0.60, complements $0.30. After 14 days, close produced 12 sales at 28% ACOS, loose produced 4 sales at 65% ACOS, substitutes produced 6 sales at 22% ACOS, complements produced 0 sales. New bids: close $0.90, loose $0.30, substitutes $0.85, complements $0.20. Substitutes jumped because competitor shoppers convert well; loose dropped because the terms were not converting."},
{t:"formula",f:"Initial bid posture: Close = base bid, Substitutes = base bid, Loose = base × 0.6, Complements = base × 0.4",note:"These are starting points, not rules. Let the data move the bids."},
{t:"mistake",items:[
"Setting the same bid on all four groups — they have different intent, different cost, different reward",
"Lowering a group to zero when it produces no sales in 7 days — that is research, not a verdict",
"Raising a group because it produced sales — the question is not 'did it sell' but 'was the ACOS acceptable'",
"Pausing a group because the ACOS is high — high ACOS in a research group is expected; what matters is the data it produces"
]},
{t:"tip",x:"If a group produces nothing in 14 days, do not pause it — that is research, not a verdict. Lower its bid and keep watching. The data is the answer; you are still waiting for the data."}
]},
{id:"m5l3",title:"Auto as Research: Reading the Report",mins:6,blocks:[
{t:"goal",x:"Read the search-term report from an auto campaign and decide what to do with each term."},
{t:"p",x:"An auto campaign's main job is to surface real customer search terms. The search-term report is the deliverable. Read it weekly. Each row is a search term that triggered your ad, with clicks, spend, sales, and ACOS. Each row needs a decision. The four decisions, in order of frequency: keep watching (small sample, let it run); promote to manual (the term is converting and deserves its own controlled bid); negate (the term is irrelevant and burning money); lower the bid (the term is converting but at an unacceptable ACOS, and a lower bid will still capture some sales at a better cost)."},
{t:"p",x:"The biggest mistake is to use the search-term report as a verdict on the auto campaign. The auto campaign is the research tool; the search-term report is its output. A 'bad' auto campaign that produces 30 irrelevant search terms and 3 winners is a great auto campaign — it found 3 winners. An 'amazing' auto campaign with 5% ACOS that produces no new terms is a bad auto campaign — it is not generating learning. Judge auto by the quality of its search-term rows, not by its own ACOS."},
{t:"split",a:{title:"Use the report for",items:[
"Discovering customer language — what they actually type",
"Finding long-tail winners that the seed list would have missed",
"Spotting irrelevant spend before it becomes a problem",
"Building the seed list for a manual campaign"
]},b:{title:"Don't use it for",items:[
"Verdict on the auto campaign itself — judge by the rows, not the ACOS",
"Permanent negatives from 3 clicks — one term on 3 clicks is not enough data",
"Pausing auto entirely after one bad week — one bad week is one week, not a verdict",
"Reading 7-day ACOS on a research campaign — research needs 30+ days to be meaningful"
]}},
{t:"mistake",items:[
"Negating a term after 2 clicks because the ACOS is high — 2 clicks is not data",
"Promoting a term after 1 sale out of 4 clicks — a sample of one is not a trend",
"Negating terms the auto campaign already learned from — if the campaign is not spending on the term, the negative is redundant",
"Reading the report once a month — by then, irrelevant spend has had 30 days to accumulate"
]},
{t:"tip",x:"Read the search-term report every week, every auto campaign. If you can read it every Monday morning, you will catch problems on Tuesday instead of next month."}
]},
{id:"m5l4",title:"Overlap and Negative Controls",mins:6,blocks:[
{t:"goal",x:"Manage overlap between auto and manual campaigns so each campaign owns its terms cleanly."},
{t:"p",x:"Auto and manual campaigns can both bid on the same customer search. The auction picks one. The ad shows; the shopper clicks; the click is attributed to one campaign, not both. The result: the campaign that did not win the auction has no data on that term. This is not a bug; it is how the system is built. The way to manage it is with negatives."},
{t:"p",x:"The pattern: when a manual Exact campaign proves a term profitable, promote it to its own row in the manual campaign and add the term as a negative exact inside the auto campaign. Now the manual campaign owns the term cleanly, and the auto campaign continues to discover new terms. The auto campaign's job is to find; the manual campaign's job is to control. The negative is the handoff."},
{t:"list",items:[
"Run a manual Exact campaign on a proven term",
"Add the term as negative exact inside the auto campaign",
"Now the manual campaign owns the term without auction competition from auto",
"Auto continues to discover new terms and surface new winners"
]},
{t:"example",x:"Bamboo Cutting Board, auto campaign surfaces 'bamboo cutting board large' with 14 sales at 22% ACOS. Promote it: create a manual Exact campaign, add the term, bid $0.90. Then in the auto campaign, add 'bamboo cutting board large' as a negative exact. The auto campaign no longer bids on that term; the manual campaign owns it. The auto campaign's search-term report will surface new terms, some of which will become the next promoted winners."},
{t:"mistake",items:[
"Running auto and manual on the same term with no negatives — the auction picks one, and the other campaign has no data on that term",
"Negating the term in the manual campaign instead of the auto — auto is the research tool, and it should keep discovering",
"Adding a negative before the manual campaign is set up — the term spends a few days in limbo, neither owned nor discovered",
"Believing overlap is a bug to avoid — overlap is how you graduate a term into a controlled campaign, and the negatives are the tool"
]},
{t:"tip",x:"Overlap is not a bug — it is how you graduate a discovered term into a controlled campaign. The negatives are the tool, not a problem to avoid."}
]}
]},
{id:"m6l1",title:"Match Types in Practice",mins:6,blocks:[
{t:"goal",x:"Pick a match type based on the data you have, not on a default, and explain how the choice changes as the data grows."},
{t:"p",x:"Match type is a function of data state, not of personal preference. No data: you do not know what shoppers will type, so you need a match type that surfaces variety — Phrase gives you that, because it will trigger on phrases that contain your seed term, in any order, with words before or after. Some data: you know which terms convert; promote those to Exact, keep Phrase running for the long tail. Lots of data: you know your winners; tighten to Exact for control, and run a small Broad campaign for ongoing discovery so the account keeps learning new terms."},
{t:"p",x:"The trap is to choose a match type and leave it. Beginners either default to Exact (because it sounds safe) or default to Broad (because it sounds exciting). Both defaults are wrong. The right default is a function of time on the account: the longer you have run, the more you should be on Exact; the less time you have run, the more you should be on Phrase. Broad is for an active discovery campaign, not for the workhorse targeting of an established account."},
{t:"split",a:{title:"Choose Exact when",items:[
"The term is proven profitable (30+ clicks, healthy ACOS)",
"You need to control spend tightly to hit a target ACOS",
"You are scaling a winner and the bid matters",
"The shopper intent is clear and the term is short"
]},b:{title:"Choose Broad when",items:[
"You have no data and want to discover the customer's wording",
"You want to find new variations of a known term",
"You can afford some waste in exchange for breadth",
"You run a small ongoing discovery campaign alongside Exact"
]}},
{t:"example",x:"Bamboo Cutting Board, day 1: run Phrase on the seed list of 50 terms. Day 30: review the search-term report. The 8 terms that converted are now promoted to Exact with their own bids. The 12 terms that produced clicks but no sales are negated. Phrase continues with the remaining 30. Day 60: another 4 terms earn promotion. Day 90: the workhorse is mostly Exact, with a small Broad campaign running on the most general term for ongoing discovery."},
{t:"mistake",items:[
"Defaulting to Exact because it sounds safe — with no data, you will be right slowly instead of wrong fast",
"Defaulting to Broad because it sounds exciting — you will burn budget on terms you should not be bidding on",
"Leaving the match type alone after the first choice — match type is a function of data state, and the data state changes",
"Promoting a term to Exact after 5 clicks — promote after 30, with healthy ACOS"
]},
{t:"tip",x:"Match type is a function of data state, not of personal preference. No data: Phrase. Some data: Phrase + Exact winners. Lots of data: Exact + small Broad for discovery."}
]},
{id:"m6l2",title:"Research vs Performance Campaigns",mins:6,blocks:[
{t:"goal",x:"Run research and performance in separate campaigns with different jobs, and explain what each one is for."},
{t:"p",x:"A research campaign's job is discovery. It runs auto and Broad match with small bids, in a separate campaign with a separate budget, with a separate name (something like 'SP-Research'). The expected output is a stream of new search terms, some winners, some irrelevant. The expected ACOS is high, because the goal is data, not profit. The right time horizon is 30+ days. The right metric is 'how many new terms did this surface?' not 'what was the ACOS?'."},
{t:"p",x:"A performance campaign's job is control. It runs Phrase and Exact on proven terms, with bid rules tied to ACOS targets, in a separate campaign with a separate name (something like 'SP-Performance'). The expected output is profit. The expected ACOS is at or below break-even. The right time horizon is weekly. The right metric is the ACOS and the volume of attributable sales. Mixing research and performance in one campaign makes both worse — performance gets polluted by research noise, research gets starved by performance spend."},
{t:"p",x:"The right way to bridge them: the research campaign surfaces winners; promote them to the performance campaign; negate them in the research campaign. Now the performance campaign owns the term cleanly, and the research campaign continues to discover. Two campaigns, two jobs, two budgets, two names, one stream of learning. The auto/manual split is the same idea, applied to the auto vs manual boundary."},
{t:"split",a:{title:"Research campaign",items:[
"Auto and Broad",
"Small bid, separate budget",
"Goal is terms, not profit",
"30+ day horizon",
"Judged by quality of search-term rows"
]},b:{title:"Performance campaign",items:[
"Phrase and Exact on proven terms",
"Optimized bid, separate budget",
"Goal is profit at target ACOS",
"Weekly horizon",
"Judged by ACOS and volume"
]}},
{t:"mistake",items:[
"Mixing research and performance in one campaign — performance gets polluted, research gets starved",
"Reading the research campaign's ACOS as a verdict — high ACOS in research is expected and informative",
"Stopping the research campaign when the performance campaign is profitable — research is the source of next quarter's winners",
"Promoting a term from research to performance on 4 clicks — promote on 30+ with healthy ACOS"
]},
{t:"tip",x:"Two campaigns, two jobs, two budgets, two names. The research campaign finds; the performance campaign controls. The handoff is the promotion."}
]},
{id:"m6l3",title:"Single-Keyword vs Grouped Ad Groups",mins:6,blocks:[
{t:"goal",x:"Decide when one keyword per ad group is useful, and when it is excessive overhead."},
{t:"p",x:"A single-keyword ad group is a manual ad group with one keyword. The benefit is maximum control: the bid is surgical, the data is clean, the term is observable in isolation. The cost is overhead: every ad group is a unit of management, and ten single-keyword ad groups take ten times the management of one ten-keyword ad group. The right time for single-keyword ad groups is when the term is high-spend and the bid needs to be tuned precisely — a top-3 term for your product, where a $0.05 bid change is real money."},
{t:"p",x:"A grouped ad group is a manual ad group with several keywords that share intent. The benefit is less management overhead; the cost is the bid is average, and you cannot tune individual terms without the others. The right time for grouped ad groups is when the spend is too small to justify the structure — a long-tail cluster of similar-intent terms where individual bid control does not matter. The right default for most campaigns: grouped ad groups, with single-keyword ad groups created only for terms that earn them."},
{t:"table",head:["Approach","Best for","Cost","When to use"],rows:[
["Single keyword","High-spend winners, exact control","More campaigns to manage","Term is in top-3 by spend and bid matters"],
["Grouped ad group","Long-tail clusters, similar intent","Less work, slightly less data clarity","Default for most campaigns and most terms"]
]},
{t:"example",x:"Bamboo Cutting Board. The 5 terms that produce 70% of the spend (top-3 terms plus two close variants) are split into 5 single-keyword ad groups with surgical bids. The remaining 30 terms (long tail) sit in 2 grouped ad groups by intent cluster — one cluster for size-related, one for use-case-related. Total ad groups: 7, not 35. The structure is earned by the spend, not applied uniformly."},
{t:"mistake",items:[
"Creating single-keyword ad groups for every term — overhead will eat the time you save on tuning",
"Refusing to split out a top-3 term because 'all ad groups should look the same' — the structure should match the spend, not the philosophy",
"Grouping terms with different intents into one ad group — the bid becomes a compromise, and a compromise is a lie",
"Restructuring mid-flight because the data shifted — wait 30 days before changing the structure"
]},
{t:"tip",x:"Default to grouped ad groups. Split out a single keyword only when the spend is meaningful and the bid needs surgical control. The structure should earn its keep."}
]},
{id:"m6l4",title:"Launch Bids and Placement Expectations",mins:6,blocks:[
{t:"goal",x:"Set a safe launch bid, and know what to expect in week 1, week 2, and week 4 of a new campaign."},
{t:"p",x:"A safe launch bid is around the suggested bid Amazon shows in the campaign creation flow, or slightly below. The reasoning: you have no data to justify a high bid yet. Starting above the suggested bid is a bet that you know better than Amazon's estimate, and most new managers do not. Start at or slightly below; let the data tell you whether to raise. The most common beginner mistake is reading week 1 silence as failure. It is not. It is the auction learning who you are."},
{t:"p",x:"The four-week arc: Day 1-3, low impressions, low clicks, almost no orders. The auction is figuring out your relevance; the data is not yet meaningful. Day 4-7, the search-term report starts to look like real shopper language. Your data is starting to mean something. Week 2, you have enough data to make one careful change. Week 4, the structure decisions are starting to compound — match type, bid, negative list, the campaign is taking shape. The trap is to act on day-2 silence. The right move is to wait. Patience in week 1 is the price of good decisions in week 4."},
{t:"list",items:[
"Day 1-3: low impressions, low clicks, almost no orders — the auction is learning",
"Day 4-7: search-term report starts to look like real shopper language — data is starting to mean something",
"Week 2: enough data to make one careful change — one change, not five",
"Week 4: structure decisions are starting to compound — match type, bid, negatives"
]},
{t:"example",x:"Bamboo Cutting Board, day 1, $0.85 suggested bid. You launch at $0.75. Day 1-3: 800 impressions, 12 clicks, 1 sale, $9 spend. Day 4-7: 4,200 impressions, 96 clicks, 8 sales, $72 spend. Search-term report shows 'bamboo cutting board large', 'eco cutting board', 'wooden chopping board' as the top 3. Week 2 decision: promote 'bamboo cutting board large' to Exact, negate 'cutting board plastic'. One change, not five."},
{t:"mistake",items:[
"Starting the bid above the suggested bid because 'I want top of search' — you have no data to justify that bet",
"Reading day 1-3 silence as a failure — it is the auction learning, not the auction rejecting",
"Making 5 changes in week 2 because the data is finally interesting — one careful change per week, not five",
"Killing the campaign at day 7 because the ACOS is high — high ACOS in week 1 is the noise of small samples; wait for week 4"
]},
{t:"tip",x:"The most common beginner mistake is reading week 1 silence as failure. It is not. It is the auction learning who you are. Patience in week 1 is the price of good decisions in week 4."}
]}
]},
quiz:[
{q:"Best default for a beginner with no data?",o:["Exact only","Phrase or Exact","Broad only","No targeting"],a:1,e:"Tight enough to learn, loose enough to discover."},
