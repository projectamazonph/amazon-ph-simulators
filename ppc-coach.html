{q:"Research and performance campaigns should be…",o:["Mixed together","Separate, with different jobs","The same campaign","Paired with the same budget"],a:1,e:"Separation keeps the data clean."},
{q:"A safe launch bid is…",o:["3× the suggested bid","Around the suggested bid, slightly below","Zero","Whatever wins top of search"],a:1,e:"No data means no justification for a high bid."}
]},

{title:"Product Targeting",icon:"📦",color:"#0EA5E9",img:IMG.market,desc:"ASIN and category targeting, defensive plays, and the retail-readiness check.",
lessons:[
{id:"m7l1",title:"ASIN Targeting vs Category Targeting",mins:6,blocks:[
{t:"goal",x:"Pick between targeting individual ASINs and targeting a whole category, and explain the trade-off in spend, intent, and risk."},
{t:"p",x:"ASIN targeting is precise. You choose the exact products your ad appears next to — usually a competitor you want to challenge, a complement you want to sit beside, or your own ASINs (defensive). The cost is research: you have to know which ASINs to target, you have to maintain the list, and you have to refresh it as the category changes. The benefit is control: every click happens next to a product you have chosen, and the rationale is a sentence."},
{t:"p",x:"Category targeting is broad. You pick a category node and Amazon places your ad on any product in that node. The cost is relevance: your ad will appear on products that have nothing to do with yours. The benefit is reach: with zero research, you can cast a wide net and let the data tell you which ASINs deserve attention. The two are not interchangeable. ASIN targeting is the workhorse; category targeting is the discovery tool."},
{t:"split",a:{title:"Use ASIN targeting for",items:[
"Specific competitors you have a plan against",
"Defending a category position (your own ASINs and your brand)",
"Cross-sell on complementary products you have chosen",
"High-spend products where the bid matters and the rationale must be sharp"
]},b:{title:"Use category targeting for",items:[
"Quick, broad coverage before you know the competitive map",
"Discovery in a new category you are still learning",
"Scale where the ASIN list is not yet built",
"Budgeting a research spend on a category you do not yet understand"
]}},
{t:"example",x:"Bamboo Cutting Board. ASIN targets: top-3 competitor cutting boards in your price band, plus 2 high-end wooden boards (for the gift cluster), plus 1 chef's-knife set (cross-sell). Category target: 'Cutting Boards & Chopping Blocks' node, narrow leaf. ASIN list = controlled, defensible, audit-able. Category list = broad, noisy, useful for finding new ASIN targets."},
{t:"mistake",items:[
"Defaulting to category targeting because it is easy — it is easy, and it is expensive, because it is also the least controllable",
"Targeting a single ASIN with a single bid and waiting for the data — a 1-ASIN list will not teach you anything; build at least 10 before you read the report",
"Refusing to ever use category targeting — category is the discovery tool that finds your next ASIN targets",
"Targeting ASINs without comparing the offer — paying for a click that goes to a stronger competitor is paying to lose"
]},
{t:"tip",x:"ASIN targeting is the workhorse; category targeting is the discovery tool. The right pattern: use category to find candidates, promote the winners to ASIN targeting, retire the losers."}
]},
{id:"m7l2",title:"Competitor, Defensive, Cross-Sell, Complementary",mins:7,blocks:[
{t:"goal",x:"Pick a product-targeting strategy that matches a clear intent, and explain what each strategy is for and what it costs."},
{t:"p",x:"The four common product-targeting strategies, and the intent behind each. Competitor targeting: your ad appears next to a rival's product, and your goal is to convince the shopper to choose you instead. Defensive targeting: your ad appears on your own product pages and your own brand searches, and your goal is to prevent competitors from showing up there. Cross-sell targeting: your ad appears next to a complementary product, and your goal is to reach the shopper at the moment of adjacent need. Category targeting: your ad appears on a node, and your goal is broad discovery."},
{t:"p",x:"Each strategy has a different economic profile. Competitor targeting tends to be mid-cost, mid-intent — the shopper is already on a comparison page, the click is worth real money, and the conversion rate depends on whether your offer wins. Defensive targeting tends to be the lowest ACOS in the account — the shopper is already deep in your funnel, and the bid can be conservative because the goal is not to convert, it is to deny the page to competitors. Cross-sell targeting is mid-cost, mid-intent, and seasonal — it works best when the complementary product is in a related buy (knife set + cutting board, water bottle + gym bag). Category targeting is the costliest per click and the lowest-intent by default."},
{t:"table",head:["Strategy","Target type","Intent","Cost","When to use"],rows:[
["Competitor","Rival ASINs","Steal share from a comparable offer","Mid","When your offer is roughly comparable"],
["Defensive","Your own ASINs and brand","Prevent competitors on your pages","Low","Always. The cost of defense is usually lower than the cost of offense"],
["Cross-sell","Complementary ASINs","Reach shoppers buying something adjacent","Mid","When the complementary category is in a real buy pattern"],
["Category","A category node","Broad discovery","High per click","When you do not yet know the ASIN landscape"]
]},
{t:"example",x:"Bamboo Cutting Board. Competitor targets: 5 cutting-board rivals at the same price point ($20-$30). Defensive: own ASIN, brand name 'Project Amazon', 1 product family. Cross-sell: 3 high-end knife sets, 1 butcher block, 1 charcuterie set. Category: 'Cutting Boards' node. Each has a separate bid and a separate expected outcome. The defensive line gets the lowest bid and the highest impression share; the competitor line gets the highest bid; the category line gets a small discovery bid."},
{t:"mistake",items:[
"Building a competitor list without comparing offers — paying to lose the click is paying to advertise for the competitor",
"Forgetting the defensive line — the lowest-cost spend in the account is often the most forgotten",
"Mixing competitor and cross-sell in one ad group — they have different intent and deserve different bids",
"Setting the same bid on all four strategies — the bid should reflect the cost and the intent of each"
]},
{t:"tip",x:"Defensive targeting often has the lowest ACOS in the account because the shopper is already deep in your funnel. The cost of defense is usually lower than the cost of offense."}
]},
{id:"m7l3",title:"Retail-Readiness Comparison and Risk of Stronger Offers",mins:6,blocks:[
{t:"goal",x:"Reject product targets where your offer is unlikely to win, and explain how to score the comparison quickly."},
{t:"p",x:"Before you target a competitor ASIN, you have to compare five things: price, rating, review count, image quality, and the offer itself (variants, bundle, sustainability claim, brand story). If you lose on three of five, the click becomes a comparison shopper for the competitor. You pay for the click; the competitor gets the sale. This is the most expensive mistake in product targeting, because it does not look like a mistake. The click looked fine. The conversion was just low. The customer quietly bought the better product."},
{t:"p",x:"The five-signal score is fast, not exhaustive. Walk through price first (within 20% of competitor?), then rating (within 0.3 stars?), then review count (within 5x?), then image (clean, white-background, comparable?), then offer (a real differentiator or a me-too?). If you lose on three, the target is a discovery spend at best, and an advertising loss at worst. If you win on three, you have a real shot and the bid can reflect that. The score is not a verdict on the product; it is a verdict on the click's expected conversion rate."},
{t:"table",head:["Signal","Within range","Out of range","What to do"],rows:[
["Price","Within 20% of competitor","Much higher or much lower","Compete on price or accept loss"],
["Rating","Within 0.3 stars","Much lower","Improve product or skip this target"],
["Reviews","Within 5x of competitor","Much fewer","Build reviews or skip this target"],
["Image","Clean, comparable quality","Worse","Reshoot or skip this target"],
["Offer","Real differentiator","Me-too copycat","Find a differentiator or skip this target"]
]},
{t:"example",x:"Your product: $24.99, 4.5 stars, 150 reviews, 4 white-background images, eco-friendly bamboo. Competitor: $19.99, 4.7 stars, 4,000 reviews, 7 lifestyle images, plastic. Price: you lose. Rating: you lose. Reviews: you lose. Image: you tie. Offer: you tie (eco vs plastic is a real differentiator). Score: 1 win, 2 ties, 2 losses. The click will go to the competitor 70% of the time. Skip or run a defensive bid only."},
{t:"mistake",items:[
"Targeting every top-10 ASIN in the category because they are top-10 — top-10 is the leaderboard, not the target list",
"Comparing only price — a $5 cheaper competitor with 10x your reviews and a better image is not a target, it is a learning opportunity",
"Refusing to skip a target because 'every click is a chance' — a click you lose is a click that costs you money and trains the auction",
"Updating the comparison once and never again — your offer improves, the competitor's improves; the scorecard shifts monthly"
]},
{t:"tip",x:"If you lose on three of five, skip the target. The click will go to the better offer 70% of the time, and you will have paid for the comparison shopper's education."}
]},
{id:"m7l4",title:"Lab: Product-Targeting Matrix",mins:6,blocks:[
{t:"goal",x:"Build an ASIN target list and a category target list with rationale, and apply the five-signal score before going live."},
{t:"p",x:"For one product, build two lists. List A: 5-10 ASINs you would target, with one-line rationale each (this competitor is comparable on price, this one is a strong cross-sell, this one is the obvious defensive target). List B: 1-2 category nodes you would target, with one-line rationale (this node is where my shopper actually browses, this one is the discovery net). For each entry, score on price, rating, reviews, image, and offer. Reject any target where you lose on three or more."},
{t:"p",x:"The list is not done when it is long. The list is done when every entry has a reason and a comparator score. The score is the gate; the rationale is the audit trail. Six months from now, when the data tells you the bid is wrong on entry 7, you will look at the rationale to remember why you targeted it, and you will look at the score to know whether to keep targeting. The structure of the list is the structure of the campaign's learning."},
{t:"example",x:"Bamboo Cutting Board, list A: 5 cutting-board rivals at $20-$30 (each scored and one line of rationale), 2 high-end wooden boards for the gift cluster, 1 chef's-knife set for cross-sell, 1 butcher block, 1 charcuterie set. List B: 'Cutting Boards' narrow node, 'Kitchen Boards & Trays' broader node. Each entry has a row in a single spreadsheet: target ASIN, price, rating, reviews, image quality, offer, score, rationale, starting bid. The list is auditable and revisable."},
{t:"mistake",items:[
"Building a 50-ASIN list without rationale — a 50-ASIN list with no rationale is a list of guesses",
"Skipping the score because the target 'looks like a good competitor' — looking comparable is not the same as being comparable",
"Refreshing the list once a year — the competitor's offer improves, your offer improves, the scorecard shifts",
"Targeting an ASIN because it is the bestseller without checking your offer — the bestseller is the hardest target, not the easiest"
]},
{t:"tip",x:"The list is not done when it is long. It is done when every entry has a reason and a comparator score. The reason is the rationale; the score is the gate. Both matter."}
]}
]},
quiz:[
{q:"Product targeting on a stronger offer usually…",o:["Wins on the click","Pays for the competitor's comparison shopper","Improves TACoS","Beats organic"],a:1,e:"You pay for the click, the competitor gets the sale."},
{q:"Defensive product targeting is bidding on…",o:["Competitor ASINs","Your own brand and ASINs","Categories only","Top of search only"],a:1,e:"Defensive = protect your own pages."},
{q:"Before ASIN-targeting a competitor, you should compare…",o:["Color only","Price, rating, reviews, images, offer","Reviews only","Bid only"],a:1,e:"Five signals, not one."}
]},

{title:"Bidding, Placements, and Budgets",icon:"💸",color:"#EF4444",img:IMG.deck,desc:"Dynamic bids, placements, effective exposure, and budget pacing.",
lessons:[
{id:"m8l1",title:"Budget Basics",mins:5,blocks:[
{t:"goal",x:"Set a daily budget that supports learning without overcommitting, and explain why 'budget' is a cap, not a target."},
{t:"p",x:"A daily budget is the cap on what you will spend in a day, not a target of what you should spend. The right number is the smallest budget that lets the campaign produce enough clicks to learn. For a beginner campaign, that is at least 10-20 clicks per day per cluster, which usually means a $10-30 daily budget for the first few weeks. The cap is what protects you from a bad week; the lower you can keep it, the smaller the bad week can be."},
{t:"p",x:"The principle: budget is the speed limit, not the destination. A campaign that consistently hits its budget by 4pm and produces profitable sales is capped — raise the budget. A campaign that hits its budget by 10am and produces unprofitable sales is over-funded — lower the budget, lower the bid, or add negatives. The right budget is the one that matches the campaign's job. Research campaigns get small budgets; performance campaigns get bigger ones; scale campaigns get the most."},
{t:"formula",f:"Learning budget = target clicks per day × expected CPC. Profit budget = (target daily sales / CVR) × AOV",note:"For a $0.75 CPC and 20 clicks/day target, the learning budget is ~$15/day. The profit budget scales with the math, not the hope."},
{t:"example",x:"Bamboo Cutting Board, new manual campaign. $0.85 suggested bid. Target: 20 clicks/day. Learning budget: $17/day. After 30 days, the campaign has 40 sales at 24% ACOS. Now scale: target $200/day in sales. At 8% CVR and $25 AOV, profit budget = ($200 / 0.08) = $2,500/day gross sales, with $600/day in ad spend at 30% ACoS. The math replaces the guess."},
{t:"mistake",items:[
"Setting a $100/day budget on a campaign with no data — a $100/day spend on a bad campaign is a $700/week hole",
"Setting a $5/day budget because the campaign is new — a $5/day budget on 20-click learning is not enough clicks to learn",
"Refusing to raise the budget on a profitable campaign because 'spend is risky' — profitable spend is the point, not the problem",
"Setting the same budget on every campaign — the budget should match the job"
]},
{t:"tip",x:"If a profitable campaign is out of budget by 9am, the budget is too low, not the campaign. But first confirm the campaign is actually profitable — 'out of budget' is not automatically a budget problem."}
]},
{id:"m8l2",title:"Top of Search, Rest of Search, Product Pages",mins:6,blocks:[
{t:"goal",x:"Explain the three placements, what each tends to deliver in cost and conversion, and how to read the placement report."},
{t:"p",x:"The three placements are where your ad can show up. Top of Search is above the organic results — the shopper has just searched, the page is the search results, your ad is at the top. The shopper is high-intent (they are looking) but the position is contested (every advertiser wants top of search) and the CPC is the highest of the three. Rest of Search is mixed in with the organic results on a search page — still search intent, but lower position, lower CPC, often lower conversion. Product Pages is the placement on competitor product detail pages and on category browse pages — the shopper is browsing, the intent is mixed, the CPC is usually the lowest of the three."},
{t:"p",x:"The right way to read the placements is the placement-level report, not intuition. For 14 days, run the campaign without placement adjustments and let the report show what each placement actually delivered. Top of Search may have a higher CVR, or it may not. Product Pages may have a lower ACOS, or it may not. The data answers; your assumption does not. Once you have 14 days of placement data, you can adjust. Before that, you are guessing."},
{t:"table",head:["Placement","Where","Typical CPC","Typical CVR","Typical ACOS"],rows:[
["Top of Search","Above the organic results","High","High to mid","Mid to high"],
["Rest of Search","Mixed in the organic results","Mid","Mid","Mid"],
["Product Pages","On competitor and category pages","Low","Low to mid","Low to high (varies most)"]
]},
{t:"example",x:"Bamboo Cutting Board, 14 days, no adjustments. Top of Search: 2,400 impressions, 110 clicks, 9 sales, $0.92 CPC, 33% ACOS. Rest of Search: 5,200 impressions, 80 clicks, 5 sales, $0.55 CPC, 35% ACOS. Product Pages: 8,400 impressions, 95 clicks, 4 sales, $0.38 CPC, 36% ACOS. All three placements have similar ACOS in this case. The decision is volume vs cost: Top of Search costs more but converts more, Product Pages costs less but converts less. Adjustments are small here."},
{t:"mistake",items:[
"Assuming Top of Search is always the best placement — sometimes the data shows Product Pages has a better ACOS, and the bid should reflect that",
"Refusing to advertise on Product Pages because 'browsers don't convert' — some products convert on Product Pages because the comparison page is the moment of decision",
"Raising the Top of Search adjustment before reading the report — a 100% adjustment on a placement that does not convert is a fast way to lose money",
"Setting the same placement adjustment on every campaign — the data is per-campaign, and so are the adjustments"
]},
{t:"tip",x:"Top of Search is not always the most profitable placement. It is the most expensive. Read the placement-level report before raising a placement adjustment. The data is the answer; your assumption is the question."}
]},
{id:"m8l3",title:"Placement Adjustments and Effective Bid Exposure",mins:7,blocks:[
{t:"goal",x:"Compute the effective bid after a placement adjustment, and explain what placement adjustments actually do to your spend."},
{t:"p",x:"A placement adjustment is a multiplier on the base bid, applied only when your ad wins a particular placement. A +50% top-of-search adjustment on a $0.80 base bid means the effective bid is $1.20 if the auction is for a top-of-search slot. A 0% adjustment means the effective bid is $0.80 in that slot. The adjustment is the way to say 'I value this placement more' (positive adjustment) or 'I do not want to pay for this placement' (negative adjustment, including -100% which means 'never show in this placement')."},
{t:"p",x:"The effective bid is what matters, not the adjustment percentage. A 100% adjustment on a $0.30 base bid is $0.60 — modest. A 100% adjustment on a $1.20 base bid is $2.40 — a serious premium. Always compute the effective bid before setting an adjustment, especially on a high-base campaign. The right adjustment is the one that produces the right effective bid, not the one that produces the most aggressive percentage."},
{t:"formula",f:"Effective bid = base bid × (1 + placement adjustment). A +50% top-of-search adjustment on a $0.80 base bid = $1.20 effective. A -100% adjustment = $0 effective (never show in this placement).",note:"Adjustments are not free; they are multipliers on real money. Compute the effective bid before you set the percentage."},
{t:"example",x:"Base bid $0.60. Top of Search +100% → effective $1.20. Product Pages +0% → effective $0.60. Rest of Search -50% → effective $0.30. The campaign will fight hard for Top of Search, accept Product Pages, and largely avoid Rest of Search. The CPC will reflect the priorities: top slots are most expensive, the rest are cheaper, and the campaign's mix of placements will follow the adjustments."},
{t:"mistake",items:[
"Setting +100% on Top of Search without computing the effective bid — a $1.50 base becomes a $3.00 effective, and the spend goes up before the conversions do",
"Setting -100% on Product Pages because 'browsers don't convert' — sometimes the placement is profitable; -100% removes the chance to find out",
"Setting the same adjustment on every campaign — each campaign has its own base bid and its own data, and the adjustments should match",
"Changing the adjustment more than once a week — the placement data needs at least 14 days to be meaningful"
]},
{t:"tip",x:"Set placement adjustments based on data, not on intuition. Run a placement report for 14 days first. The adjustment is a multiplier on the base bid; the effective bid is the real number you are paying."}
]},
{id:"m8l4",title:"Dynamic Bids: Down Only / Up and Down / Fixed",mins:6,blocks:[
{t:"goal",x:"Pick the right bid strategy for the campaign's job, and explain why 'down only' is the safe default for a beginner."},
{t:"p",x:"Dynamic bids are Amazon's automated bid adjustments. Down only: Amazon may lower your bid (never raise) when a click is unlikely to convert. Up and down: Amazon may raise or lower your bid based on conversion likelihood. Fixed: your bid is the bid, period. Each strategy is a different amount of control traded for a different amount of automation. Down only is the safest because it can never spend more than you set; Up and Down is the most aggressive because it can spend up to 100% more than you set; Fixed is the most predictable because nothing is automated."},
{t:"p",x:"The right choice depends on the campaign's data and the campaign's job. Beginners with no data should default to 'down only' for the first 4 weeks — the strategy protects you from overpaying on low-conversion clicks while the auction learns your relevance. Campaigns with 30+ conversions can move to 'up and down' for growth, because Amazon now has signal to spend more on likely-converting clicks. Campaigns that need surgical control (a launch with a strict budget, a high-stakes scale campaign) should run Fixed."},
{t:"table",head:["Strategy","Behavior","Bid range","Use for","Don't use for"],rows:[
["Down only","Amazon may lower your bid, never raise","Up to -100% of base","Beginner, defensive, scale with limited budget","Aggressive growth where you want Amazon to spend more"],
["Up and down","Amazon may raise or lower your bid","Up to +100% / -100% of base","Growth, when you have 30+ conversions and want volume","Strict budget control, surgical bid management"],
["Fixed","Your bid is the bid, period","Exact base bid","Launches, tight control, predictable spend","Discovery where automation could help"]
]},
{t:"example",x:"Bamboo Cutting Board, 4 weeks. Week 1-4: down only. The campaign produced 24 sales at 28% ACOS. Week 5: switch to up and down, keep the same base bid. Two weeks later, the campaign is producing 35% more sales at 32% ACOS — slightly worse ACOS, but more volume and the data says the spend is worth it. Week 7: review; if ACOS stays above target, switch back to down only. The strategy is a dial, not a switch."},
{t:"mistake",items:[
"Defaulting to up and down because 'more volume' — without conversion data, Amazon does not know when to spend more",
"Defaulting to fixed because 'I want control' — fixed is the right choice for surgical control, not for every campaign",
"Switching strategies more than once a month — each switch restarts the learning period, and the data becomes noise",
"Believing dynamic bids are a magic growth tool — they are an amplifier, not a strategy; bad data amplified is bad spend amplified"
]},
{t:"tip",x:"Beginners should default to 'down only' for the first 4 weeks. Move to 'up and down' only after the campaign has 30+ conversions. Bid strategy is a function of data state, just like match type."}
]},
{id:"m8l5",title:"Budget Pacing and 'Out of Budget ≠ Budget Problem'",mins:6,blocks:[
{t:"goal",x:"Diagnose why a campaign is out of budget before raising the budget, and explain the three reasons a campaign can be capped."},
{t:"p",x:"'Out of budget' is a symptom, not a diagnosis. Three different problems can produce the same alert. First, the campaign is profitable and capped — sales are coming in, ACOS is healthy, but the budget is too small to capture all the demand. Raise the budget. Second, the campaign is unprofitable and burning — sales are weak, ACOS is bad, and the spend is going to waste. Lower the budget, lower the bid, add negatives. Third, the day is front-loaded — the campaign spends fast in the morning and is out by 2pm, but the spend is healthy. Adjust the pacing, not the budget."},
{t:"p",x:"The diagnostic is the placement report, the search-term report, and the ACOS. If ACOS is below margin and stable, the campaign is profitable and capped — raise the budget. If ACOS is above margin, the campaign is unprofitable and burning — fix the campaign before the budget. If the campaign is consistently out of budget by 4-6pm, the budget is too small for the demand. The right move depends on which of the three reasons you are seeing. The wrong move is always to raise the budget."},
{t:"split",a:{title:"Raise the budget when",items:[
"ACOS is below margin and stable",
"The campaign hits budget by 4-6pm consistently",
"You have 14+ days of clean data showing the campaign is healthy",
"The day's spend pattern is steady, not front-loaded"
],b:{title:"Don't raise the budget when",items:[
"ACOS is above margin and rising",
"The campaign just launched and is still in the learning period",
"Spend is being driven by irrelevant search terms you have not yet negated",
"You cannot tell from the data whether the spend is profitable"
]}},
{t:"example",x:"Bamboo Cutting Board, performance campaign, day 14. ACOS 24%, margin 30%, profitable. Out of budget by 11am. Diagnosis: profitable and capped. Move: raise daily budget from $20 to $40. Day 21, ACOS 26%, sales up 60%, still profitable. Move: raise to $60. Day 28, ACOS 30%, sales up 90%, at the margin line. Stop. The budget found the ceiling. The next move is bid adjustment, not more budget."},
{t:"mistake",items:[
"Raising the budget every time a campaign hits its cap — sometimes the cap is the campaign telling you it has found its ceiling",
"Lowering the budget on a profitable campaign because 'spend is scary' — profitable spend is the goal, not the threat",
"Raising the budget on an unprofitable campaign because 'more spend will fix it' — more unprofitable spend is more loss, not more data",
"Diagnosing the budget problem from the alert alone — the alert is a symptom; the report is the diagnosis"
]},
{t:"tip",x:"'Out of budget' is a symptom, not a diagnosis. The right move depends on which of the three reasons you are seeing. The wrong move is always to raise the budget without looking."}
]},
{id:"m8l6",title:"Bid Change Walkthrough (Worked)",mins:6,blocks:[
{t:"goal",x:"Walk through a bid change with reason, old value, new value, expected result, and review date, and explain why every bid change needs all five."},
{t:"p",x:"Every bid change should answer five questions: Why am I changing it? What was the old bid? What is the new bid? What do I expect to happen? When will I review the result? If any of the five is missing, the change is a guess. If the change is a guess, the result is hard to interpret. If the result is hard to interpret, the next change is also a guess. The five-question template is the structure that turns guessing into learning."},
{t:"p",x:"The walkthrough example below shows the five-question template applied to a real bid change. The reason came from data, the old and new bids are explicit, the expected result is a number, and the review date is concrete. Six months from now, when you look back at the change, you will know exactly what you were trying to do and exactly what happened. That is the difference between a PPC account that learns and a PPC account that just runs."},
{t:"example",x:"Target: 'bamboo cutting board' Exact. 14 days. 35 clicks, 4 sales, ACOS 22%, margin 30%. Decision: raise bid 15% from $0.80 to $0.92. Reason: 14 days, healthy ACOS, sales steady, room under margin. Expected: more impressions, slightly lower ACOS, more sales. Review date: 14 days from now. On the review date: 70 clicks, 9 sales, ACOS 24%, sales up 125%, ACOS up 2 points. Decision: keep the bid; raise the budget. The change worked. The next change is informed by it."},
{t:"mistake",items:[
"Changing a bid without a written reason — six weeks from now, you will not remember why, and the data will be uninterpretable",
"Raising a bid by 100% because 'I want more sales' — large changes are hard to learn from; small changes compound",
"Reviewing the change after 3 days — 3 days is noise; 14 days is signal; review on the date you set",
"Making 5 bid changes in the same week — each change needs its own review period, and stacked changes make attribution impossible"
]},
{t:"tip",x:"Every bid change needs five things: reason, old value, new value, expected result, review date. No exceptions. The template is the structure; the structure is the learning."}
]}
]},
quiz:[
{q:"Top of Search placement adjustment is…",o:["A flat fee","A multiplier on the base bid","A budget","A negative"],a:1,e:"Placement adjustment multiplies the base bid."},
{q:"Beginner default bid strategy?",o:["Up and down","Down only","Fixed at max","No bid"],a:1,e:"Down only is the safe default for the first 4 weeks."},
{q:"A campaign is out of budget. You should first…",o:["Raise the budget","Check whether it is profitable","Pause it","Double the bid"],a:1,e:"Out of budget is not automatically a budget problem."}
]},

{title:"Search-Term Analysis and Negatives",icon:"🕵️",color:"#0EA5E9",img:IMG.triage,desc:"Targeting vs search-term report, harvesting, and click thresholds.",
lessons:[
{id:"m9l1",title:"Reading the Search Term Report",mins:6,blocks:[
{t:"goal",x:"Read a search-term report and tell winners from wasters from maybes, and explain the four patterns that cover 90% of decisions."},
{t:"p",x:"The search-term report is the customer telling you what they typed. Sort by spend, highest first — the biggest spend is the biggest decision. Then walk each row through four patterns. A waster: high clicks, zero or 1 sale, irrelevant term. A winner: any clicks, steady sales, ACOS below margin. A maybe: under 10 clicks, unclear. A mixed: medium clicks, some sales, relevant but expensive. The patterns overlap at the edges, but the four cover the bulk of decisions and stop you from inventing a new category every week."},
{t:"p",x:"The action is not on the row — the action is on the campaign. A waster gets added as a negative at the ad-group or campaign level (one click and the negative is in force for the whole campaign). A winner gets promoted to Exact (so the spend is concentrated on a high-confidence match). A maybe gets watched for another week. A mixed gets a lower bid and stays. The four actions, the four patterns, the same workflow every week."},
{t:"table",head:["Pattern","Clicks","Sales","Read","Action"],rows:[
["Waster","High","Zero or 1","Irrelevant term","Add as negative"],
["Winner","Any","Steady, ACOS under margin","Strong term","Promote to Exact"],
["Maybe","Under 10","Unclear","Too little data","Watch for another week"],
["Mixed","Medium","Some","Relevant but expensive","Lower bid, keep"]
]},
{t:"example",x:"Bamboo Cutting Board, 30-day report, sorted by spend. Top: 'free cutting board' — 28 clicks, 0 sales, $24 spend. Waster. Negative exact. Second: 'bamboo cutting board' — 18 clicks, 4 sales, $14 spend, 19% ACOS. Winner. Promote to Exact. Third: 'eco friendly board' — 9 clicks, 0 sales, $7 spend. Maybe. Watch. Fourth: 'wooden board large' — 12 clicks, 1 sale, $9 spend, 86% ACOS. Mixed. Lower bid 25%, keep."},
{t:"mistake",items:[
"Reading the report by impression count instead of spend — spend is the real risk; impressions are free",
"Treating 'maybe' as 'waster' and negating it — the term has not had a chance; give it another week",
"Treating 'winner' as 'scale to high bid' — promote to Exact first; raising the bid comes later if the data holds",
"Optimizing once a month instead of once a week — the data is the same every 7 days, but the actions compound weekly"
]},
{t:"tip",x:"Sort by spend, highest first. The biggest spend is the biggest decision. The report is a list of decisions, not a list of terms."}
]},
{id:"m9l2",title:"Targeting Report vs Search-Term Report",mins:5,blocks:[
{t:"goal",x:"Tell the targeting report from the search-term report and explain which report answers which question."},
{t:"p",x:"Two reports, two questions. The targeting report shows the keywords or ASINs you asked for and how each performed — did the match you chose work? The search-term report shows the actual customer queries that triggered your ads — what did the shopper actually type? The targeting report tells you what you asked for; the search-term report tells you what you got. The two reports together tell you whether to adjust the targets (you asked wrong), adjust the queries (the customers surprised you), or both."},
{t:"p",x:"Optimizing the targeting report alone is a half-optimization. You see that 'bamboo cutting board' Broad has 18% ACOS and you raise the bid, but you never see the 14 irrelevant phrases Broad let in. The search-term report is the one that produces new keywords (the harvest) and new negatives (the cleanup). The targeting report is the one that confirms the harvest worked after you have promoted. The order is: search-term first, targeting second."},
{t:"example",x:"Targeting report, 30 days. 'bamboo cutting board' Broad: 80 clicks, 9 sales, 24% ACOS. 'cutting board' Broad: 200 clicks, 14 sales, 31% ACOS. Both look healthy. Now the search-term report, 30 days, on the same campaign. 'free cutting board' 28 clicks, 0 sales (waster). 'bamboo cheese board' 18 clicks, 4 sales, 19% ACOS (winner, should be Exact). 'cutting board plastic' 30 clicks, 0 sales (waster). The targeting report said everything was fine. The search-term report said two terms should be negated and one should be promoted. The two reports are not the same report."},
{t:"mistake",items:[
"Optimizing the targeting report and never looking at the search-term report — you will miss the discovery and the wasters",
"Optimizing the search-term report without ever reading the targeting report — the targeting report is the one that tells you whether your match types are working",
"Assuming Broad match is broken because it has more wasters than Exact — Broad lets more in, and more wasters is the cost of the discovery; the net of discovery minus cleanup is positive when the workflow runs weekly",
"Conflating 'keyword' and 'search term' — keyword is what you targeted; search term is what the customer typed. The two are not the same word"
]},
{t:"tip",x:"Search-term first, targeting second. The search-term report is where new keywords come from. The targeting report is where you confirm the harvest worked."}
]},
{id:"m9l3",title:"Winners, Wasters, and Click Thresholds",mins:7,blocks:[
{t:"goal",x:"Apply a click threshold before deciding on a search term, and explain why under-10 is noise and 30+ is signal."},
{t:"p",x:"A click threshold is the minimum number of clicks a search term needs before you make a confident call. The reason is statistical: a 2-click sample has a 50% chance of being all-or-nothing by luck. A 10-click sample is at the edge of meaningful. A 30-click sample is the smallest that gives you a stable conversion rate. Below 10 clicks, you are reading noise, and the noise will mislead you. Above 30 clicks, you are reading signal, and the signal is a verdict. The threshold is not a rule; it is a confidence level."},
{t:"p",x:"The three zones of confidence. Under 10 clicks: low confidence, watch, do not act. 10-30 clicks: medium confidence, one careful change, give it a week. 30+ clicks: high confidence, trust the trend, act on it. The most common beginner error is to treat 10 clicks as a verdict. It is the bottom edge of meaningful, not the end of a useful sample. Another common error is the opposite — refusing to act on 200 clicks because the ACOS is stable. The data is telling you the truth; the data is not changing next week."},
{t:"table",head:["Clicks","Confidence","Action"],rows:[
["Under 10","Low","Watch. Do not act."],
["10–30","Medium","One careful change, give it a week."],
["30+","High","Trust the trend. Act on it."]
]},
{t:"example",x:"Bamboo Cutting Board, 30-day report. Term A: 'eco cutting board' — 4 clicks, 1 sale, 22% ACOS. Looks like a winner. Under 10 clicks. Watch. Term B: 'eco cutting board' — 28 clicks, 4 sales, 26% ACOS. Under 30. Medium confidence. One careful change (promote to Exact), review in 7 days. Term C: 'eco cutting board' — 65 clicks, 9 sales, 24% ACOS. High confidence. Promote to Exact, raise bid 10%, log the change. Three rows, three different actions, all on the same term at different sample sizes."},
{t:"mistake",items:[
"Negating a term after 3 clicks and 1 sale — the 1 sale is a sample of 1, the 0 is a sample of 2, neither is the trend",
"Promoting a term with 1 sale on 4 clicks as a 'winner' — promoting noise is worse than waiting, because the bid compounds",
"Reading one week of data as a verdict — a 7-day sample is half a normal click threshold; the verdict needs 14-30 days",
"Refusing to act on 100+ clicks because the data might change — it will not change much; 100+ is high confidence"
]},
{t:"tip",x:"Under 10 clicks is noise. 10-30 is medium — one careful change, give it a week. 30+ is signal — trust the trend. The threshold is not a rule; it is a confidence level."}
]},
{id:"m9l4",title:"Negative Exact vs Negative Phrase",mins:5,blocks:[
{t:"goal",x:"Pick the right negative match type for the situation, and explain the cost of over-negating with phrase."},
{t:"p",x:"Two flavors of negative. Negative exact blocks the single term — 'free bamboo board' gets blocked, but 'bamboo board free' still gets through. Negative phrase blocks the phrase and any search that contains it in order — 'free bamboo board' blocks 'bamboo board free' and 'best free bamboo board for kids' and every other variant with the words in that order. The two are different tools for different problems: exact is surgical, phrase is cluster-level."},
{t:"p",x:"The default is negative exact. The reason is the cost of over-negating with phrase: phrase blocks more searches than you usually want, and the blocked searches sometimes include a relevant variant you have not yet seen. Use negative exact when you have one specific term to block. Use negative phrase when a whole cluster is irrelevant (every search with 'free', every search with a brand you do not sell, every search with a wrong material). When in doubt, use exact; you can always broaden to phrase next week if the term keeps coming back."},
{t:"example",x:"Bamboo Cutting Board, search-term report, last 14 days. 'free bamboo board' (4 clicks, 0 sales) → negative exact. 'free cutting board' (3 clicks, 0 sales) → negative exact. 'free' (1 click, 0 sales — too small to act) → watch. 'plastic cutting board' (12 clicks, 0 sales) → negative exact (you sell bamboo, not plastic). 'Ikea cutting board' (8 clicks, 0 sales) → negative exact (a brand you do not want to defend). A phrase-level 'free' is too broad — it would also block 'gluten-free bamboo board' which is a real, relevant search."},
{t:"mistake",items:[
"Defaulting to negative phrase because 'it blocks more' — phrase also blocks the variant you wanted to keep",
"Negating 'free' as a phrase and accidentally blocking 'gluten-free', 'cruelty-free', 'BPA-free' — three relevant terms down the drain",
"Negating a brand you do not sell with phrase when a single exact is enough — phrase blocks the brand across word orders you do not need to block",
"Refusing to negate and waiting for the data to settle — by week 2, the waster has cost you another $20; the data was already clear at week 1"
]},
{t:"tip",x:"Default to negative exact. The cost of over-negating with phrase is the relevant search you accidentally blocked. When in doubt, use exact; you can broaden to phrase next week if the term keeps coming back."}
]},
{id:"m9l5",title:"The Harvesting Workflow",mins:6,blocks:[
{t:"goal",x:"Run a weekly harvesting loop that ends in a clean change log, and explain why the workflow is the deliverable, not the data."},
{t:"p",x:"The weekly harvesting workflow is six steps. Download the search-term report. Sort by spend, highest first. Decide each row (waster, winner, maybe, mixed). Apply the changes in the console (negatives, promotions, bid changes). Log every change with reason, old value, new value, expected result, review date. Schedule next week's review. The whole loop should take 30-60 minutes on a small account, 2-3 hours on a large one. The discipline is the same either way: the loop runs every week, the data changes, the actions are the four patterns, the log is the audit trail."},
{t:"p",x:"The point of the workflow is not the report. The point is the change log. The change log is what lets you read the account in 6 months and answer: 'Why is this bid $0.92? What was it before? What did we expect? What happened?' The report is a snapshot. The log is a story. The story is what teaches you and your client (or future you) what the account does and why."},
{t:"diagram",kind:"flow",title:"Weekly harvest",steps:["Download search-term report","Sort by spend","Decide each row (waster / winner / maybe / mixed)","Apply changes in the console","Log every change with reason, old, new, expected, review date","Schedule next review"]},
{t:"example",x:"Monday 9am. Pull report. 187 rows. Sort by spend. 12 wasters, 8 winners, 35 maybes, 22 mixed. Apply 12 negatives, promote 8 winners to Exact, lower 22 mixed bids by 15%. Total spend moved: $4.50/day down on wasters, $3.20/day up on winners. Log all 42 changes in a single sheet. Schedule next Monday. 35 minutes total. ACOS next Monday: 28% (down from 32%). The loop is the deliverable."},
{t:"mistake",items:[
"Pulling the report without logging the changes — the report is a snapshot; the log is the story; the log is what survives",
"Making the change and skipping the review — the review is where the data either confirms the action or corrects it",
"Skipping a week because 'nothing changed' — nothing changed is itself a verdict, and the next week will be different",
"Running the workflow in 4 hours every 4 weeks instead of 1 hour every week — same total time, but the weekly cadence is the discipline that produces the compounding"
]},
{t:"tip",x:"The loop is the same every week. The data changes, the workflow does not. The change log is the deliverable; the report is a snapshot; the log is the story."}
]},
{id:"m9l6",title:"Using Queries to Improve Listings",mins:5,blocks:[
{t:"goal",x:"Treat the search-term report as a listing-improvement source, not just a negatives source, and explain which query patterns map to which listing fixes."},
{t:"p",x:"The search-term report is the customer's own words, sorted by what they care about enough to type. The report is not just a negatives source — it is a listing-research source. Three patterns and three fixes. Pattern 1: shoppers keep searching for an attribute you do not mention in the title or bullets (size, material, use case). Fix: add the attribute to the copy. Pattern 2: shoppers keep searching for a use case your images do not show. Fix: add an image that shows the use case. Pattern 3: shoppers keep searching for a question your bullet points do not answer. Fix: add the answer to A+ content or the description."},
{t:"p",x:"The cheapest listing-research tool you have is the search-term report. The data is the customer's intent, free, in your console, every week. The PPC account pays for itself twice: once in sales, once in listing intelligence. Read the report with one eye on negatives and the other on what the listing is missing. Both eyes work."},
{t:"example",x:"Bamboo Cutting Board, 90 days of search terms. Top recurring pattern: 'large bamboo cutting board' (12 distinct queries, 60+ clicks). The current title says 'Bamboo Cutting Board' — no size. Fix: add 'Large' to the title. New title: 'Large Bamboo Cutting Board'. CTR +18%, sales +12% in the next 14 days. The listing was missing what the shoppers were looking for; the report told you; the change was a 2-minute edit. The other pattern: 'cutting board with juice groove' (8 queries). The product has a groove. The images do not show it. Fix: add a close-up image of the groove. Conversion +9%. The report was the listing team's free research."},
{t:"mistake",items:[
"Reading the report only for negatives and never for listing signals — you are paying for data and using half of it",
"Adding every recurring search term to the title — relevance matters; the title is a sentence, not a list of every keyword you found",
"Skipping the use-case images because the product page 'looks complete' — the report tells you what the customer wants to see, and the customer does not always see what is on the page",
"Updating the listing and not the ad — the ad and the listing should match; if the title changes, the keywords and the messaging should change with it"
]},
{t:"tip",x:"The search-term report is the cheapest listing-research tool you have. It is the customer's own words. Read it with one eye on negatives and one eye on what the listing is missing. Both eyes work."}
]}
]},
quiz:[
{q:"Search-term report shows…",o:["Keywords you targeted","What the customer typed","Bids","Budgets"],a:1,e:"Customer language, not yours."},
{q:"Under 10 clicks on a term means…",o:["Negate it","Trust the ACOS","Watch, do not act","Raise the bid"],a:2,e:"Below the threshold, it is noise."},
{q:"Negative phrase blocks…",o:["The single term","Any search containing the phrase","The campaign","The placement"],a:1,e:"Phrase negatives are cluster-level blocks."}
]},

{title:"Performance Diagnosis",icon:"🔬",color:"#10B981",img:IMG.console,desc:"Diagnose the cause before changing bids, budgets, targeting, or listings.",
lessons:[
{id:"m10l1",title:"Diagnostic Order: Delivery → Engagement → Conversion → Economics",mins:6,blocks:[
{t:"goal",x:"Use a fixed diagnostic order before changing anything, and explain why the order itself is the value."},
{t:"p",x:"Every PPC problem lives in one of four stages. Delivery: are the ads showing up at all (impressions, budget, targeting, approval)? Engagement: when the ad shows, does the shopper click (CTR, image, price, title, relevance)? Conversion: when the shopper clicks, do they buy (CVR, listing, reviews, Buy Box)? Economics: when they buy, is the math profitable (ACOS, margin, contribution)? The four stages stack: each one depends on the one above. Fixing stage 4 (ACOS) when stage 1 (impressions) is broken wastes time. Fixing stage 3 (CVR) when stage 2 (CTR) is broken hides the real problem."},
{t:"p",x:"The diagnostic order is fixed: delivery first, then engagement, then conversion, then economics. Always. The reason is that a symptom at one stage is often a problem at the stage above. High ACOS at stage 4 may be a low CVR at stage 3, which may be a low CTR at stage 2, which may be a low impression share at stage 1. Without the order, you treat the symptom. With the order, you find the cause. The most common beginner mistake is to start at economics ('ACOS is high, cut bid') without checking the stages above it. The cut-bid fix is a guess; the diagnostic-order fix is an answer."},
{t:"diagram",kind:"flow",title:"Diagnostic order",steps:["Delivery (impressions, budget, targeting)","Engagement (CTR, hook quality)","Conversion (CVR, listing relevance)","Economics (ACOS, margin, contribution)"]},
{t:"example",x:"Bamboo Cutting Board, ACOS 42%, sales flat. Beginner instinct: cut bid. Diagnostic order, instead. Stage 1: 12,000 impressions last 30 days (low for the category, healthy for a niche product — keep going). Stage 2: CTR 0.35% (low — below 0.5% benchmark). Stage 3: CVR 9% (decent for the category). Stage 4: ACOS 42% (high, but the math is downstream of CTR). Root cause: stage 2 (engagement). Fix: title, main image, price comparison. The bid is not the problem. The cut-bid instinct was a guess; the diagnostic order found the cause."},
{t:"mistake",items:[
"Starting at economics ('ACOS is high, cut bid') without checking the stages above it — the cut is a guess",
"Stopping at the first 'problem' you find — the most visible problem is often a symptom of a deeper one",
"Diagnosing once and never re-diagnosing — the order is a habit, not a one-time checklist",
"Skipping stage 1 because 'the campaign is approved' — approved is not the same as delivered; budget, bid, and targeting can all collapse delivery"
]},
{t:"tip",x:"Delivery → Engagement → Conversion → Economics. Always. The order is the value; without the order, you are guessing. The most common beginner mistake is to start at economics ('ACOS is high, cut bid') without checking the stages above it."}
]},
{id:"m10l2",title:"Low Impressions, Low CTR, High CPC",mins:7,blocks:[
{t:"goal",x:"Diagnose the top of the funnel — delivery and engagement — and explain which metric to look at first for each symptom."},
{t:"p",x:"Three symptoms and three checks. Low impressions: is the campaign active, approved, in budget, and the targeting broad enough? Low CTR: is the image, price, or title unappealing, and is the ad creative / keyword relevance strong? High CPC: is the bid too high, is the auction unusually competitive, and is the quality score (CTR history) dragging the auction? The three symptoms are at the top of the funnel, before conversion. Fixing them is cheaper than fixing conversion, because the wasted click never happened."},
{t:"p",x:"The right way to read the three is together. Low impressions, low CTR, and high CPC are not three separate problems — they are usually one. A campaign that is not delivering enough will not generate the click history that lowers CPC, and a low CTR at low impressions is a small sample that will look like noise. The fix is to attack the lowest stage first: get the impressions, then look at CTR, then look at CPC. The order is the same as the diagnostic order: delivery first, then engagement, then the cost."},
{t:"table",head:["Symptom","First check","Then"],rows:[
["Low impressions","Campaign active? Approved? Budget?","Bid too low, targeting too narrow"],
["Low CTR","Image, price, title","Hook signal; ad creative; relevance"],
["High CPC","Bid too high","Auction competition; quality score"]
]},
{t:"split",a:{title:"Healthy",items:[
"Stable impressions, stable CTR",
"CTR above the category benchmark",
"CPC near the suggested bid"
],b:{title:"Unhealthy",items:[
"Impressions dropping week over week",
"CTR below 0.3%",
"CPC above the suggested bid by 2×"
]}},
{t:"example",x:"Bamboo Cutting Board, 14-day data. Impressions: 1,800 (low — was 4,200 in the previous 14 days). CTR: 0.22% (low). CPC: $1.20 (high — suggested bid is $0.65). Three symptoms. Diagnostic order: stage 1 — impressions halved. Check budget pacing. Budget was $15/day, hit cap by 2pm most days. Either raise budget or pause. CTR is low because volume is low (small sample, but consistent with low CTR). CPC is high because the auction is competitive on a small budget. Fix: raise budget to $30/day, give it 7 days, then re-diagnose."},
{t:"mistake",items:[
"Cutting the bid on a high-CPC campaign before checking impressions — the high CPC may be small sample + competitive auction, not a bid problem",
"Refusing to raise the budget on a low-impression campaign because 'budget is risky' — the budget is the cause, not the problem",
"Diagnosing CTR in isolation from volume — 5 clicks is not a CTR verdict; wait for the data",
"Optimizing the hook (image, title) before checking budget — the most common cause of low CTR is actually low volume, not the creative"
]},
{t:"tip",x:"The three top-of-funnel symptoms (low impressions, low CTR, high CPC) are usually one problem, not three. Get the impressions first, then re-read CTR and CPC. The order is the same as the diagnostic order."}
]},
{id:"m10l3",title:"Low CVR, High ACOS, Sales Drop",mins:7,blocks:[
{t:"goal",x:"Diagnose the bottom of the funnel — conversion and economics — and explain which cause maps to which symptom."},
{t:"p",x:"Three symptoms and three checks, again, but at the bottom of the funnel. Low CVR: is the listing aligned with the search term, are the bullets and images answering the buyer's question, is the price competitive, is the Buy Box owned? High ACOS: is CPC too high, is CVR too low, or both — the math is downstream. Sales drop: is the stock available, has the price changed, have the reviews or the competitor's offer shifted, or is the structure (campaign, ad group, match type) the issue? The three are connected: a low CVR drives a high ACOS, and the high ACOS plus a small stock-out is a sales drop."},
{t:"p",x:"Before changing a bid, answer one question: is the click the problem, or is the click turning into a sale at a bad rate? The two have very different fixes. Click is the problem → lower the bid, tighten the match, add negatives. Click is converting at a bad rate → fix the listing (image, price, bullets, reviews) or fix the relevance (the search term and the listing are out of sync). The bid change is a guess; the diagnosis is an answer."},
{t:"table",head:["Symptom","First check","Then"],rows:[
["Low CVR","Listing + term relevance","Negatives, listing pass, price check"],
["High ACOS","CPC vs CVR","Lower bid, tighten match, or both"],
["Sales drop","Stock, price, reviews, competitor","If all four are fine, look at structure"]
]},
{t:"example",x:"Bamboo Cutting Board, 30-day data. CVR: 6% (was 11% last quarter, low). ACOS: 48% (high). Sales: 28 (was 42, down). Three symptoms. Diagnostic order: stage 3 first (CVR). Listing pass: image is unchanged, but a new competitor launched at $19.99 (you are $24.99). Reviews: 4.6 stars, 220 reviews (you have 4.5 stars, 350 reviews). The competitor is winning on price and on star rating slightly. Stage 4 (ACOS): high, but downstream of CVR. Stage 1+2 are healthy. Root cause: stage 3, listing + competitor. Fix options: lower price to $22.99, add a comparison image, add a price-anchored bullet, OR shift budget to a search term where the competitor is weaker. The bid is not the lever."},
{t:"mistake",items:[
"Cutting the bid when the problem is the listing — the bid change hides the real issue and leaves the conversion broken",
"Diagnosing a sales drop as a campaign problem without checking stock — out-of-stock campaigns sell zero, and the campaign is not the cause",
"Refusing to adjust price on a price-led category — sometimes the fix is a price, not a bid",
"Adding a competitor's brand as a negative instead of dealing with the comparison — the shopper who searched the brand is the highest-intent shopper in the category; negate them and you have given up"
]},
{t:"tip",x:"A sales drop with stable traffic and a sudden drop in CVR is almost always a listing or retail-readiness issue, not a campaign issue. The campaign is the messenger; the listing is the cause."}
]},
{id:"m10l4",title:"Traffic-Quality vs Offer-Quality Problems",mins:6,blocks:[
{t:"goal",x:"Tell a targeting problem from an offer problem, and explain which symptom pattern points to which."},
{t:"p",x:"Two different problems, two different fixes, two different owners. A traffic-quality problem: the wrong shoppers are clicking. The data shows it — the search terms are irrelevant, the CTR is high but the CVR is low, the ACOS is high because the click never had a chance to convert. The fix is targeting: negatives, tighter match type, different keywords, sometimes a different campaign structure. An offer-quality problem: the right shoppers are clicking but not buying. The data shows it — the search terms are relevant, the CVR is low because the listing is not closing, the ACOS is high because the click is wasted at the listing level. The fix is the offer: listing, price, images, reviews, A+ content."},
{t:"p",x:"The two require different reads. Read the search-term report at the same time as the listing. If the search terms are irrelevant, you have a traffic-quality problem — fix the targeting. If the search terms are relevant, you have an offer-quality problem — fix the listing. The temptation is to fix both at once. Resist. Fix the traffic first (negatives, match types), let the campaign settle for 7 days, then look at the offer. The two fixes compound, and changing both at once makes it impossible to know which one worked."},
{t:"example",x:"Bamboo Cutting Board, 30-day report. 240 clicks, 6 sales, 2.5% CVR, 84% ACOS. Search-term report: 'Ikea cutting board' (8 clicks, 0 sales), 'cutting board plastic' (30 clicks, 0 sales), 'free cutting board' (12 clicks, 0 sales), 'small wooden board' (15 clicks, 0 sales). Traffic-quality problem — half the clicks are irrelevant. Fix: negate the four clusters. New CVR (filtered): 5%, still low. Now look at the listing: relevant terms like 'bamboo cutting board' convert at 4%. Below benchmark but not zero. Offer-quality secondary problem. Fix the listing after the traffic is clean. Two problems, two fixes, two weeks."},
{t:"mistake",items:[
"Reading only the targeting report and assuming the listing is fine — the listing can be the cause even when the targeting looks healthy",
"Reading only the search-term report and assuming the listing is the cause — many of the irrelevant terms are the cause, and the listing is fine",
"Fixing both traffic and offer in the same week — the two fixes compound, but they need separate review periods to learn from",
"Refusing to look at the listing because 'we already optimized it' — listings decay, competitors ship, and what was true last month is not true this month"
]},
{t:"tip",x:"Read the search-term report at the same time as the listing. The combination tells you which problem you have. Irrelevant terms = traffic-quality. Relevant terms = offer-quality. The two have different fixes, and the fixes need separate weeks."}
]},
{id:"m10l5",title:"Lab: Root-Cause Tree for Six Cases",mins:8,blocks:[
{t:"goal",x:"Build a root-cause tree for an underperforming account, and explain why the tree is a habit, not a one-time exercise."},
{t:"p",x:"For each of six common cases, draw the diagnostic tree from symptom to root cause. (1) Low impressions: budget, bid, targeting, approval, day-parting. (2) High clicks, no sales: traffic-quality, offer-quality, data delay, Buy Box, stock. (3) Profitable but capped: ACOS healthy, budget too small, scale-up decision. (4) High CPC at top of search: bid, competition, quality score, placement adjustment. (5) High-ACOS competitor conquest: comparable check, listing gap, five-signal score. (6) Seasonality shock: data window, year-over-year, structural vs cyclical. The tree is the same every time: symptom, branches, root cause, action, review date."},
{t:"p",x:"The tree is a habit, not a one-time exercise. The same six cases appear in every account, every quarter. The data is different; the tree is the same. After you have drawn the tree twenty times, the diagnosis takes a few minutes instead of a few hours. The skill is not in the case — the case is always one of six — the skill is in the discipline of not skipping a branch. State the uncertainty. State the follow-up data. State the review date. The diagnosis is not a guess; it is a structured argument."},
{t:"example",x:"Case 2, high clicks, no sales. Symptom: 240 clicks, 4 sales, ACOS 92%, CVR 1.7%. Branches: (a) Traffic-quality? Search-term report shows 40% of clicks are on irrelevant terms. Yes, partial. (b) Offer-quality? Listing has 4.4 stars, 95 reviews, price in line. Listing is weak but not the primary cause. (c) Data delay? 30 days of data. No. (d) Buy Box? Owned. No. (e) Stock? In stock. No. Root cause: traffic-quality, with a secondary offer-quality issue. Action: negate the irrelevant clusters, give it 14 days, then re-read the CVR. If CVR is still below 5%, fix the listing next. State the uncertainty: 30 days is solid but not 60. State the follow-up data: re-diagnose in 14 days. State the review date: 14 days from now."},
{t:"mistake",items:[
"Diagnosing from a single symptom without checking the branches — single-symptom diagnosis is guessing",
"Stopping at the first branch that 'explains' the problem — the first branch is often partial; the full tree is the answer",
"Skipping the review date — the diagnosis is a hypothesis; the review is where the hypothesis is confirmed or rejected",
"Using the same root cause for every campaign in the account — campaigns fail for different reasons; the tree is per-campaign, not per-account"
]},
{t:"tip",x:"Every action should connect to an observed symptom. State uncertainty and required follow-up data on every diagnosis. The diagnosis is not a guess; it is a structured argument. The tree is a habit, not a one-time exercise."}
]}
]},
quiz:[
{q:"First step in any diagnosis?",o:["Cut the bid","Check delivery (impressions, budget, targeting)","Pause the campaign","Add negatives"],a:1,e:"Always start at delivery."},
{q:"High clicks, no sales, irrelevant search terms suggests…",o:["Offer-quality problem","Traffic-quality problem","Budget problem","Placement problem"],a:1,e:"Wrong shoppers, fix with targeting."},
{q:"A change log should record…",o:["The bid","Reason, old, new, expected, review date","Only successful changes","The date only"],a:1,e:"Five things, every change."}
]},

{title:"Optimization, Scaling, and Operating Rhythm",icon:"🔁",color:"#8B5CF6",img:IMG.deck,desc:"The weekly cycle, scaling without inflating marginal ACOS, and the change log.",
lessons:[
{id:"m11l1",title:"The Weekly Routine",mins:5,blocks:[
{t:"goal",x:"Run the same weekly routine every week, and explain why the routine is the value rather than the data."},
{t:"p",x:"The weekly routine has six steps, in this order, every week. Pull the search-term report. Promote winners to Exact. Negate wasters. Review bids on the surviving targets. Check budgets and pacing on the surviving campaigns. Write the report. Log every change. The order matters: search-term report first (it is the source of new keywords and new negatives), then bid review (it is downstream of the report), then budget review (it is downstream of bid), then report and log (it is downstream of everything). The routine is the same when the account is healthy and when the account is in trouble. The discipline is the value; the data is the input."},
{t:"p",x:"The most common reason operators skip the routine is 'the account is fine.' The account is never fine forever. The week you skip is the week the data drifts and you do not notice. The week you skip is the week a waster compounds, a winner is not harvested, and the next week starts with stale decisions. Run the routine when the data is good, so the routine is habit when the data is bad."},
{t:"diagram",kind:"flow",title:"Weekly routine",steps:["Pull the search-term report","Promote winners, negate wasters","Review bids on surviving targets","Check budgets and pacing","Write the one-page report","Log every change with reason, old, new, expected, review date"]},
{t:"example",x:"Bamboo Cutting Board, Monday 9am. 45 minutes. Pull report (5 min). 8 winners to promote (10 min), 12 wasters to negate (5 min), 22 mixed to lower bid (5 min). 6 bid reviews on Exact targets (5 min). Budget check: 2 campaigns capped by 2pm (5 min). Report: 1 page, 12 lines (8 min). Log: 42 changes in the change log (5 min). 45 minutes total. ACOS Monday next week: 27% (down from 32%). The routine is the value."},
{t:"mistake",items:[
"Skipping a week because 'nothing changed' — nothing changed is itself a verdict, and the next week will be different",
"Reordering the steps (bids first, report second) — the order is the discipline; reordering it loses the data the next step needs",
"Running the routine once and expecting to maintain the account — the routine is a habit, not a one-time sweep",
"Doing the routine in 4 hours once a month instead of 45 minutes every week — same total time, but the weekly cadence is what produces the compounding"
]},
{t:"tip",x:"The routine is the same when things are good and when they are bad. The discipline is the value. The week you skip is the week the data drifts and you do not notice. Run the routine when the account is healthy, so the routine is habit when the account is in trouble."}
]},
{id:"m11l2",title:"One Change at a Time",mins:5,blocks:[
{t:"goal",x:"Make one change per variable per week, and explain why two changes at the same time is the same as zero changes."},
{t:"p",x:"The one-change rule is a rule about learning, not about speed. Change one variable, give it a week, compare before-and-after, log it. If you change bid, budget, and match in the same week, you do not know which one worked — and you do not know which one hurt. The data is the same in both cases; only the operator can tell the difference. The operator who changed three things does not know. The operator who changed one does."},
{t:"p",x:"Two changes at the same time is the same as zero changes. The work is wasted because the learning is destroyed. A week is not a long time to wait for an answer; a year of three-change weeks is a long time to wait for nothing."},
{t:"example",x:"Bamboo Cutting Board, 'bamboo cutting board' Exact, week 14. Bid $0.80, 14-day ACOS 22%, margin 30%. Decision: cut bid to $0.72. Wait. Week 15, ACOS 19%, sales flat. One change, one verdict — cut worked. Alternative: change bid to $0.72 AND add 3 negatives AND raise budget 20% in the same week. ACOS drops to 18%. Did the bid cut work? Did the negatives help? Did the budget raise dilute them? No operator can answer. Three changes, zero learning. The week 15 verdict is a guess."},
{t:"mistake",items:[
"Changing bid and adding negatives on the same day — the verdict is uninterpretable; the work is wasted",
"Pausing a campaign and changing the budget in the same week — the pause and the budget are two levers, not one",
"Trusting 'vibes' instead of the change log — vibes is a guess with no data; the change log is a verdict with data",
"Stacking 4-5 'small' changes in one week because 'they are all small' — five small changes in one week is one big experiment with no controls"
]},
{t:"tip",x:"One change per variable per week. Two changes at the same time is the same as zero changes. The work is wasted because the learning is destroyed. A week is not a long time to wait for an answer; a year of three-change weeks is a long time to wait for nothing."}
]},
{id:"m11l3",title:"Bid Increase vs Bid Decrease Decision Tree",mins:7,blocks:[
{t:"goal",x:"Use a small tree to pick between raise, hold, and cut, and explain why the tree is a habit rather than a calculator."},
{t:"p",x:"The bid-change tree has three branches. ACOS below margin and stable: raise 10-15%, log, review in 7 days. ACOS above margin: cut 10-15%, log, review in 7 days. ACOS at margin: hold and watch for another week. The tree is the same every week; the data is different. The reason to use a tree is not the answer (the answer is simple) — the reason is the discipline. The tree forces you to look at the data before you act, to commit to a change size (10-15% is the safe learning range), to log the reason, and to set a review date. The tree is a habit, not a calculator."},
{t:"p",x:"A 10-15% change is small enough to be safe, large enough to learn. Anything less is below the noise floor — you will not be able to tell whether the ACOS change is the change or the random week. Anything more is gambling — if you cut 50% and ACOS drops, you do not know if 25% would have done the same job, and you have given up half the volume for a margin you did not need to give up. 10-15% is the sweet spot. Most weeks, that is the only change you make."},
{t:"diagram",kind:"tree",title:"Bid change tree",nodes:[
[0,"Bid review"],
[1,"ACOS below margin and stable?"],
[2,"Yes: raise 10-15%, log, review 7 days"],
[2,"No: ACOS above margin?"],
[2,"Above: cut 10-15%, log, review 7 days"],
[2,"At margin: hold and watch for another week"]
]},
{t:"example",x:"Bamboo Cutting Board, 7-day data. Target A: 'bamboo cutting board' Exact, ACOS 18%, margin 30%, stable. Tree: raise. Bid $0.80 → $0.90. Log: raise 12.5%, reason stable ACOS below margin, expected ACOS under 25%, review 7 days. Target B: 'cutting board for kitchen' Phrase, ACOS 41%, margin 30%. Tree: cut. Bid $0.65 → $0.56. Log: cut 14%, reason ACOS above margin, expected ACOS under 35%, review 7 days. Target C: 'large bamboo cutting board' Phrase, ACOS 28%, margin 30%. Tree: hold. Bid unchanged. Log: hold, reason ACOS at margin, expected confirm trend in 7 days. Three targets, three branches, three logs. The tree is the same; the data is different."},
{t:"mistake",items:[
"Raising or cutting 50%+ because 'the data is clear' — the data is rarely that clear, and a 50% change is too large to learn from",
"Skipping the 'hold' branch and cutting on margin — sometimes the right answer is to wait, and patience is a verifiable action",
"Trusting a 3-day trend — the tree runs on 7-day or 14-day data; a 3-day ACOS is noise dressed up as a verdict",
"Applying the tree without a logged rollback condition — a bid change without a 'if X then revert' rule is a guess with a deadline"
]},
{t:"tip",x:"A 10-15% change is small enough to be safe, large enough to learn. Anything more is gambling. The tree is a habit, not a calculator. The reason to use a tree is the discipline — the tree forces you to look at the data, commit to a size, log the reason, and set a review date."}
]},
{id:"m11l4",title:"Budget Reallocation and Placement Optimization",mins:7,blocks:[
{t:"goal",x:"Reallocate budget to where the data says it works, and explain why reallocation is more powerful than raising total budget."},
{t:"p",x:"Reallocation means moving budget from underperforming campaigns to overperforming ones, not adding total spend. The account's total budget may stay flat. The reason: the first dollar in a campaign is more expensive than the fifth, and a campaign that is already capped at 2pm is not asking for more money — it is asking for the money that another campaign is wasting. Move 20-30% of the worst campaign's budget to the best one, log the move, watch for two weeks, repeat if it holds. Reallocation is more powerful than raising total budget because the data is already there — you are not generating new data, you are redistributing the data you have."},
{t:"p",x:"Placement optimization is the same logic at a finer grain. The three placements are top of search, product pages, and rest of search. Top of search costs the most and converts the best. Product pages costs less and converts worst. Rest of search is in the middle. Read the placement report, identify the placement with the worst ACOS at meaningful spend, identify the placement with the best ACOS at meaningful spend, and use placement adjustments (positive or negative percentages) to move spend from the weak to the strong. The same 10-20% adjustment, the same 7-day review, the same log."},
{t:"list",items:[
"Identify the campaign with the worst ACOS at meaningful spend (at least 14 days of data, 30+ clicks)",
"Identify the campaign with the best ACOS at meaningful spend",
"Move 20-30% of the worst campaign's budget to the best one (do not pause the worst — pause is a verdict, reallocation is a hypothesis)",
"Log the move: campaign, old budget, new budget, reason, expected outcome, review date",
"Watch for 14 days (not 7 — reallocation takes longer than a bid change to settle)",
"Repeat if it holds; revert if the worst campaign's metrics improve (reallocation works in both directions)"
]},
{t:"example",x:"Bamboo Cutting Board, monthly view. Campaign A: Auto, $15/day, ACOS 38%, 12 sales. Campaign B: Exact, $20/day, ACOS 19%, 18 sales. Worst at meaningful spend: A. Best: B. Reallocate: cut A to $10/day, raise B to $25/day. Total budget unchanged. 14 days later: A ACOS 32% (improved — less waste), B ACOS 21% (slightly higher — more volume, more wasters, but still profitable). Total sales: 38 (was 30). ACOS blended: 26% (was 28%). Same total spend, better outcome. Reallocation is more powerful than raising total budget."},
{t:"mistake",items:[
"Raising total budget instead of reallocating — the first dollar in a good campaign is more expensive than the fifth, and the bad campaign is still wasting the rest",
"Pausing the worst campaign instead of reallocating — pause is a verdict; reallocation is a hypothesis. Pause loses the data the campaign was generating",
"Reallocating without a review date — the reallocation is the change; the review is the learning",
"Moving budget based on 3-day data — reallocation needs 14+ days to settle; 3 days is a sample of one weekend"
]},
{t:"tip",x:"Reallocation is more powerful than raising total budget. The first dollar in a campaign is more expensive than the fifth. The data is already there — reallocation is redistributing it, not generating it. 20-30% at a time, 14-day review, log the move."}
]},
{id:"m11l5",title:"Scaling Winners Without Inflating Marginal ACOS",mins:7,blocks:[
{t:"goal",x:"Scale a winning campaign in a way that holds the marginal ACOS, and explain why the marginal click is the only click that tells you whether to keep scaling."},
{t:"p",x:"Scaling means adding budget or raising bids. Every new click is more expensive than the last, because the easy wins were already taken. The marginal ACOS — the ACOS of the most recent click, not the campaign average — tells you when to stop. A campaign can show a 22% blended ACOS while the marginal ACOS is 35%, and the next $100 will be sold at 35%, not 22%. The blended ACOS is the past; the marginal ACOS is the future."},
{t:"p",x:"Read the marginal ACOS by sorting recent clicks by time (last 7 days vs the prior 7 days) and watching the trend. If the marginal ACOS is rising as spend rises, you are saturating the auction. If the marginal ACOS is flat or falling as spend rises, the auction is not saturated and you can keep scaling. The three signals to watch: marginal ACOS (the verdict), conversion rate stability (the quality), and top-of-search crowding (the ceiling). The scaling decision is safe when all three are healthy; the scaling decision is stop when any one breaks."},
{t:"split",a:{title:"Safe to scale when",items:[
"Marginal ACOS is still under margin (compare last 7 days vs prior 7 days)",
"Conversion rate is stable (no drop in last 7 days vs prior 7 days)",
"The auction is not saturated (top-of-search placement share is not crowded)"
],b:{title:"Stop scaling when",items:[
"Marginal ACOS rises above margin (the new spend is unprofitable)",
"Conversion rate is dropping (the new clicks are not as qualified as the old)",
"Top of search is becoming crowded (placement share is at 80%+; the next dollar fights for scraps)"
]}},
{t:"example",x:"Bamboo Cutting Board, Exact campaign, 30 days. Week 1-2: $20/day, 18 sales, 19% ACOS. Week 3-4: $20/day, 17 sales, 22% ACOS (small drift, still healthy). Week 5: raise budget to $30/day. Week 5-6: 26 sales, 24% ACOS. Marginal ACOS: was 19% in week 3-4, is 24% in week 5-6. Rising. The new $10/day is sold at a higher marginal ACOS than the old $20. Still under margin. Continue. Week 7: $30/day, 28 sales, 28% ACOS. Marginal ACOS approaching margin. Stop. The 28% blended is past; the 28% marginal is the future. Do not raise again. The data is telling you the ceiling."},
{t:"mistake",items:[
"Scaling on the blended ACOS instead of the marginal ACOS — the blended ACOS is the past; the marginal ACOS is the future",
"Raising the budget in 100% jumps instead of 20-30% — a 100% jump dilutes the experiment and confuses the next decision",
"Refusing to scale because the marginal ACOS is 'a little high' — a little high is still under margin, and the volume is profitable",
"Refusing to stop when the marginal ACOS is at margin — at margin is the ceiling, not the floor; the next click loses money"
]},
{t:"tip",x:"The marginal ACOS is the only ACOS that tells you whether to keep scaling. The blended ACOS is the past; the marginal is the future. Compare last 7 days vs prior 7 days. If marginal is rising, you are saturating. If marginal is flat or falling, the auction has room."}
]},
{id:"m11l6",title:"Change Log, Guardrails, Rollback Conditions",mins:6,blocks:[
{t:"goal",x:"Run every change through a log with rollback conditions, and explain why a change without a rollback is a guess with a deadline."},
{t:"p",x:"A change log records seven things: date, campaign, target, the change itself, the reason, the expected outcome, and the review date. A guardrail is a rule that triggers a rollback (e.g. 'if ACOS exceeds 50% for 7 days, revert the change'). A rollback condition is the answer to 'how will I know this change was wrong?' Every change needs a reason, an expected outcome, and a rollback condition. Without all three, the change is a guess with a deadline. With all three, the change is a hypothesis with a verdict."},
{t:"p",x:"The guardrail and the rollback condition are not the same thing. A guardrail is a pre-set rule (e.g. 'no bid change above 30% in one week'). A rollback condition is a per-change rule (e.g. 'this specific bid raise reverts if ACOS exceeds 35% for 7 days'). The guardrail is a policy; the rollback is a contract. Both belong in the change log. The log is not a record of what you did — the log is a record of what you did, why, what you expected, and how you will know it worked. The log is the audit trail; the audit trail is the deliverable."},
{t:"example",x:"Change: raise bid on 'bamboo board' Exact from $0.80 to $0.92. Date: 2026-08-30. Campaign: Exact-1. Target: 'bamboo board'. Change: bid $0.80 → $0.92 (+15%). Reason: 14-day ACOS 18%, margin 30%, conversion stable. Expected: more impressions, ACOS stays under 25%. Review date: 2026-09-06. Guardrail: any bid change over 30% needs manager approval (this is under). Rollback: if ACOS exceeds 35% for 7 days, revert to $0.80. Logged. One line, seven fields, one contract. The change is a hypothesis, not a guess."},
{t:"mistake",items:[
"Logging the change but skipping the reason — the reason is the field that teaches you in 6 months what the data was telling you",
"Logging the change but skipping the rollback condition — a change without a rollback is a guess with a deadline; the data will tell you it was wrong, but you will not be ready to listen",
"Setting the rollback condition so tight it triggers on a 3-day noise — the rollback needs 7+ days of data to fire; a 3-day rollback is reactive, not analytical",
"Skipping the log because 'the change is small' — small changes still need a log; the log is the audit trail; small is the most common change"
]},
{t:"tip",x:"A change without a rollback condition is a guess with a deadline. Always write the condition before you click Save. The log is not a record of what you did — it is a record of what you did, why, what you expected, and how you will know it worked. The log is the deliverable."}
]}
]},
quiz:[
{q:"Scaling means…",o:["Adding total budget always","Adding budget or bids where the data supports it","Pausing losing campaigns","Lowering bids"],a:1,e:"Scale where the data says it works."},
{q:"A rollback condition is…",o:["A date to delete the campaign","A rule that triggers a revert","A bid cap","A budget cut"],a:1,e:"Always write the condition before saving."},
