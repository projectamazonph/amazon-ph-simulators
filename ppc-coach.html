{q:"One change at a time exists to…",o:["Slow you down","Let you know which variable worked","Save clicks","Help Amazon"],a:1,e:"One variable, one verdict."}
]},

{title:"Reporting, Strategy, and Capstone",icon:"📣",color:"#F59E0B",img:IMG.report,desc:"Reports, business metrics, the 30/60/90 roadmap, and the capstone defense.",
lessons:[
{id:"m12l1",title:"The Simple Report Structure",mins:5,blocks:[
{t:"goal",x:"Write a one-page weekly report in a fixed order, and explain why the structure is the same every week regardless of what the data is."},
{t:"p",x:"A weekly PPC report has six sections, in this order, every week. Numbers: spend, sales, ACOS, ROAS, clicks, orders, CTR, CVR. Trend: vs last week, plus or minus X%. What worked: 1-2 examples. What did not work: 1 honest paragraph. Next steps: 2-3 bullets, in the next 7 days, measurable. Prepared by: name, date. The structure is the same whether the week was a 5% ACOS improvement or a 12% ACOS regression. The structure is not the data; the structure is the wrapper that lets the data be read."},
{t:"p",x:"The reason the structure is fixed is the reader. The reader (the owner, the manager, the client) does not re-learn the report every week. They learn the report once, and the report fits the same template. The cognitive load is on the numbers, not the layout. A report that is structurally different every week forces the reader to re-orient before they can read the data. A report that is structurally the same every week lets the reader go straight to the numbers. The structure is the value."},
{t:"list",items:[
"Numbers: spend, sales, ACOS, ROAS, clicks, orders, CTR, CVR (this week's actuals)",
"Trend: vs last week, plus or minus X% on each number (the comparison is the meaning)",
"What worked: 1-2 examples with the change log reference (the wins the routine produced)",
"What did not work: 1 honest paragraph with the data and the next step (no spin, no hiding)",
"Next steps: 2-3 bullets, in the next 7 days, measurable (the report ends in motion, not in numbers)",
"Prepared by: name, date (the audit trail)"
]},
{t:"example",x:"Bamboo Cutting Board, week 14, 1-page report. Numbers: spend $142, sales $498, ACOS 28.5%, ROAS 3.51, clicks 1,180, orders 20, CTR 0.31%, CVR 1.7%. Trend: spend -8% (less wasters negated), sales +12%, ACOS -3.5 pts, CTR +0.04 pts, CVR flat. What worked: promoted 8 search terms to Exact (sales +$58). Negated 12 wasters (wasted spend -$22). What did not work: 'cutting board for kitchen' Phrase is still 41% ACOS despite a bid cut last week; one more cut or a move to Exact is the next step. Next steps: (1) re-cut 'cutting board for kitchen' bid by 15% on Friday; (2) re-read CTR after 7 days; (3) raise 'bamboo board' Exact bid by 12% on Monday. Prepared by: AM, 2026-08-30. One page, six sections, twelve minutes to write."},
{t:"mistake",items:[
"Writing a 4-page report when 1 page will do — the owner reads the headline, the trend, and the next steps; everything else is supporting",
"Reordering the sections to match what was good this week — the structure is the same whether the week was good or bad",
"Hiding the bad week in the trend line — 'what did not work' gets its own section, in plain language",
"Skipping the next steps because 'we will see next week' — the next steps are the report's reason for existing"
]},
{t:"tip",x:"The structure is the same every week. The numbers change, the structure does not. The structure is the wrapper that lets the data be read. A report that is structurally different every week forces the reader to re-orient before they can read the data."}
]},
{id:"m12l2",title:"Explaining Numbers in Human Words",mins:6,blocks:[
{t:"goal",x:"Translate metrics into owner-friendly language, and explain why the job of the report is translation, not data."},
{t:"p",x:"Owners do not think in ACOS. They think in 'are we making money on this product, and is it growing?' The job of the report is to translate. ACOS becomes 'on every $100 of ad sales, we keep $X after ad cost, and our margin covers it.' ROAS becomes 'every dollar spent, we get $X back.' TACoS becomes 'this product's whole-business health, including the organic sales the ads helped build.' CTR becomes 'out of every 1,000 shoppers who saw the ad, Y clicked.' CVR becomes 'out of every 100 shoppers who clicked, Z bought.' The metric is the data; the translation is the meaning."},
{t:"p",x:"The test is simple: if the owner has to ask what the number means, the report has failed. The job is translation. The temptation is to deliver the metric and let the owner translate. The cost is the owner's confidence — an owner who is not sure what the numbers mean will not be sure the operator is doing the right job. The cost is also the operator's leverage — an owner who can read the report makes faster, more confident decisions. Translate before you deliver."},
{t:"example",x:"'ACOS is 22%' is true. 'On every $100 of sales from ads, we keep $78 after ad cost, and our margin covers it' is human. The same number; the second sentence is the meaning. 'TACoS is 8%' is true. '8% of our total revenue is paying for ads, and 92% of revenue is organic or untracked — ads are building a brand, not just renting sales' is human. The same number; the second sentence is the strategic story. Three sentences, three different translations, three different conversations with the owner."},
{t:"mistake",items:[
"Delivering the metric and expecting the owner to translate — the report's job is translation; if the owner is doing it, the report failed",
"Translating ACOS into 'efficiency' without telling the owner whether the ads are profitable — efficiency is not the question; profitability is",
"Translating every metric the same way every week — the translation should match the owner's question, not a template",
"Skipping the translation when the news is bad — bad news translated well is recoverable; bad news in metric form is a panic"
]},
{t:"tip",x:"If the owner has to ask what the number means, the report has failed. The job is translation. Translate before you deliver. The cost of not translating is the owner's confidence and the operator's leverage. Bad news translated well is recoverable; bad news in metric form is a panic."}
]},
{id:"m12l3",title:"Performance Narrative: Outcome, Drivers, Actions, Risks, Next Steps",mins:6,blocks:[
{t:"goal",x:"Write a report that tells a story, not just a number, and explain why the narrative is what the owner remembers."},
{t:"p",x:"A performance narrative has five parts, in this order. Outcome: what happened (numbers + trend). Drivers: why it happened (one or two named causes, with the data). Actions: what we did about it (with the change log reference). Risks: what could go wrong (stock, competition, seasonality, auction). Next steps: what we will do this week, in measurable terms. The narrative is not the numbers; the narrative is the meaning the numbers carry. A report with only numbers is a spreadsheet. A report with a narrative is a story the owner can repeat to a partner, an investor, or themselves."},
{t:"p",x:"The reason the narrative matters: owners remember the drivers and the next steps. They glance at the numbers. Write accordingly. The numbers are the data; the drivers are the explanation; the next steps are the motion. A report that has only numbers is a fact; a report that has a narrative is a decision. The decision is what the owner makes. The decision is what the operator's job enables. The narrative is the value the operator adds on top of the data."},
{t:"list",items:[
"Outcome: what happened (numbers + trend, in 2-3 sentences)",
"Drivers: why it happened (one or two named causes, with the data — the search-term report, the listing change, the competitor)",
"Actions: what we did about it (with the change log reference — bid cut, negatives added, listing edited)",
"Risks: what could go wrong (stock, competition, seasonality, auction, dependency on one keyword)",
"Next steps: what we will do this week, in measurable terms (the report ends in motion)"
]},
{t:"example",x:"Bamboo Cutting Board, week 14 narrative. Outcome: 'Spend down 8%, sales up 12%, ACOS down 3.5 points to 28.5%.' Drivers: 'Two drivers. First, we negated 12 search-term wasters (free, plastic, Ikea) which reduced wasted spend by $22/day. Second, we promoted 8 winners to Exact, which concentrated spend on high-confidence terms and lifted CVR slightly.' Actions: 'Per the change log: 12 negatives added 2026-08-23, 8 promotions to Exact 2026-08-23, 22 bid cuts on mixed terms 2026-08-25.' Risks: 'One dependency: 'bamboo cutting board' Exact is now 38% of sales. Stock is in (4 weeks at current velocity). Competition: a new seller at $19.99 is gaining share on 'large bamboo board'.' Next steps: '(1) Cut 'cutting board for kitchen' Phrase bid 15% Friday. (2) Re-read CTR 7 days after title change. (3) Raise 'bamboo board' Exact bid 12% Monday.' Five sections, one story, twelve minutes."},
{t:"mistake",items:[
"Writing the numbers and skipping the drivers — the drivers are the explanation; without them, the numbers are noise",
"Writing the drivers without the data — a driver without the data is an opinion; a driver with the data is a diagnosis",
"Skipping the risks because the week was good — the risks are what the operator sees that the owner does not; skipping them is hiding",
"Ending the narrative on the outcome instead of the next steps — the next steps are the motion; the report ends in motion, not in past tense"
]},
{t:"tip",x:"Owners remember the drivers and the next steps. They glance at the numbers. Write accordingly. The numbers are the data; the drivers are the explanation; the next steps are the motion. A report that has only numbers is a fact; a report that has a narrative is a decision. The narrative is the value the operator adds."}
]},
{id:"m12l4",title:"PPC Metrics vs Business Metrics, and 30/60/90 Roadmap",mins:7,blocks:[
{t:"goal",x:"Distinguish PPC metrics from business metrics, build a 30/60/90 roadmap, and explain why the roadmap is a contract, not a wish list."},
{t:"p",x:"Two frames, two questions. PPC metrics answer 'did the ad do its job?' — ACOS, ROAS, CTR, CVR, placement share, marginal ACOS. Business metrics answer 'did the product grow?' — total sales, profit, TACoS, inventory turn, organic rank, brand searches. The two frames are not interchangeable. A campaign can have 18% ACOS and the product can be losing money (margin compression elsewhere). A campaign can have 32% ACOS and the product can be growing (ads are funding organic rank). The operator reads the PPC frame; the owner reads the business frame. The report needs both."},
{t:"p",x:"The 30/60/90 roadmap is a forward-looking plan with three phases. 30 days: launch or stabilize. 60 days: optimize. 90 days: scale or document. Each phase has an owner, a metric, and a review date. A roadmap without owners and review dates is a wish list, not a roadmap. The roadmap is the contract between the operator and the owner. The 30-day phase ends in a verdict (did we launch? did we stabilize?); the 60-day phase ends in a verdict (did we optimize? did the ACOS drop? did the CVR rise?); the 90-day phase ends in a verdict (did we scale? did we document the play?). Each verdict is a decision point. The roadmap is the decision tree."},
{t:"table",head:["Frame","Question","Examples"],rows:[
["PPC","Did the ad do its job?","ACOS, ROAS, CTR, CVR, placement share"],
["Business","Did the product grow?","Total sales, profit, TACoS, inventory turn"]
]},
{t:"example",x:"Bamboo Cutting Board, 30/60/90. 30 days (Aug-Sep): launch and stabilize. Owner: AM. Metric: ACOS under 35% by end of week 4. Review date: 2026-09-27. 60 days (Oct-Nov): optimize. Owner: AM. Metric: ACOS under 28% by end of week 8, organic rank for 'bamboo cutting board' top 20. Review date: 2026-11-22. 90 days (Dec): scale or document. Owner: AM + manager. Metric: total revenue +30% vs 60-day baseline, OR document the SOP if the product is at ceiling. Review date: 2026-12-27. Three phases, three owners, three metrics, three review dates. The roadmap is a contract, not a wish list."},
{t:"mistake",items:[
"Building a roadmap without owners — the owner is the field that makes the roadmap a contract; without it, the roadmap is a slide",
"Building a roadmap without metrics — the metric is the verdict; without a metric, the phase has no end",
"Building a roadmap without review dates — the review date is the deadline; without one, the phase is open-ended and the contract is unenforceable",
"Confusing PPC metrics with business metrics in the roadmap — the 30/60/90 should include both frames, because the owner is reading the business frame"
]},
{t:"tip",x:"PPC metrics ask 'did the ad do its job?' Business metrics ask 'did the product grow?' The two frames are not interchangeable; the report needs both. A 30/60/90 without owners and review dates is a wish list, not a roadmap. The roadmap is the contract between the operator and the owner."}
]},
{id:"m12l5",title:"Tasks by Cadence and the Permissions Ladder",mins:6,blocks:[
{t:"goal",x:"Match tasks to a cadence and a permission level, and explain why the ladder protects the account from the operator's own over-confidence."},
{t:"p",x:"The cadence table maps tasks to time. Daily (5 min): spend, alerts, stock, accidental pauses — the operator does this alone. Weekly (1 hr): term harvest, negatives, bid review, report — the operator does this alone. Biweekly (1 hr): structure review, naming, portfolio review — the operator does this with a manager. Monthly (2 hr): listing audit, unit-economics refresh, 30/60/90 review — the operator does this with a manager. The cadence is not negotiable; the cadence is the discipline that keeps the account in shape without the account taking over the operator's week."},
{t:"p",x:"The permissions ladder says: small safe changes alone, big levers with approval. Adding a negative is small. Raising a bid 10% is small. Cutting a bid 15% is small. Pausing a campaign is big. Raising a budget 50% is big. Restructuring an ad group is big. Adding new keywords is medium. The ladder protects the account from the operator's own over-confidence. A junior operator with senior permissions will make senior mistakes. A senior operator with junior permissions will move slowly. The right permission for the right operator at the right tenure is the discipline. The ladder is not a control problem; it is a learning problem."},
{t:"table",head:["Cadence","Tasks","Permission"],rows:[
["Daily (5 min)","Spend, alerts, stock, accidental pauses","Self-managed"],
["Weekly (1 hr)","Term harvest, negatives, bid review, report","Self-managed"],
["Biweekly (1 hr)","Structure review, naming, portfolio review","With manager"],
["Monthly (2 hr)","Listing audit, unit-economics refresh, 30/60/90 review","With manager"]
]},
{t:"example",x:"Bamboo Cutting Board, weekly cadence. Monday 9am (45 min): term harvest + bid review + report. Tuesday (5 min): spend and stock check. Wednesday (5 min): same. Thursday (5 min): same. Friday 9am (15 min): log the week's changes, plan next week, schedule Monday. Total: 80 minutes/week. The cadence is the discipline; the report is the deliverable. The permissions ladder: junior operator can add negatives, raise or cut bids 10-15%, raise budget 10% — all alone. Junior operator cannot pause a campaign, restructure an ad group, or raise budget 50% — needs manager approval. The ladder protects the account and the operator."},
{t:"mistake",items:[
"Doing biweekly work weekly (or vice versa) — the cadence is a time budget, not a guideline; over-cadence work burns time, under-cadence work misses the routine",
"Skipping the biweekly structure review because 'the structure is fine' — structure is the highest-leverage thing to review; a wrong structure costs more than a wrong bid",
"Giving junior operators senior permissions because 'they are capable' — capability is not the question; tenure and exposure to error is the question",
"Refusing to delegate the daily check to a junior operator — the daily check is a 5-minute task; the operator's job is the weekly work, not the daily"
]},
{t:"tip",x:"The cadence is the discipline that keeps the account in shape without the account taking over the operator's week. The permissions ladder protects the account from the operator's own over-confidence. The ladder is not a control problem; it is a learning problem. The right permission for the right operator at the right tenure is the discipline."}
]},
{id:"m12l6",title:"Client Communication and the Capstone",mins:7,blocks:[
{t:"goal",x:"Communicate a campaign plan, defend optimization decisions, and complete the capstone, and explain why the capstone is the proof of every lesson in the program."},
{t:"p",x:"The capstone brings the program together into a single deliverable. A product brief (what is the product, who is the shopper, what is the margin). Unit economics (price, COGS, fees, contribution, break-even ACOS). A campaign portfolio (Auto for research, Phrase for discovery, Exact for control, the budget split and the reason). A search-term analysis (the 4-pattern triage of the current data, with the change log). A 30-day plan (the cadence, the permissions, the owners). A one-page report (the structure, the narrative, the next steps). A 7-10 minute defense (recorded or written) explaining every decision. Pass level for supervised work is 85%+. The capstone is the proof."},
{t:"p",x:"The capstone is not a test of memorization. The capstone is a test of judgment under constraint. The product is real (or real-enough). The data is real (or real-enough). The decision is yours. The defense is your reasoning, in plain words, with the data, in front of a manager or a client. The capstone is where the lessons stop being lessons and start being practice. The 12 modules, 60 lessons, the trainer, the builder, the report builder, the AI coach, the cohort — all of it converges on the capstone. The capstone is the program."},
{t:"list",items:[
"Open every client call with the headline number, not the data dump — the owner wants the verdict, then the data, then the next steps",
"Defend each decision with the change log and the data — 'I cut the bid because 14-day ACOS was above margin' is a defense; 'I cut the bid because it felt right' is not",
"Translate metrics into owner language without hiding bad news — bad news in plain words is recoverable; bad news in metric form is a panic",
"End with measurable next steps and the next review date — the call ends in motion, with a deadline"
]},
{t:"example",x:"Capstone, Bamboo Cutting Board, week 14. Product brief: bamboo cutting board, $24.99, 30% margin. Unit economics: COGS $8, FBA fees $7, ad spend budget $7, contribution $2.99 per unit. Break-even ACOS 30%. Campaign portfolio: Auto $10/day (research), Phrase $10/day (discovery), Exact $20/day (control). Search-term analysis: 8 winners promoted, 12 wasters negated, 22 mixed bid cuts. Change log: 42 entries. 30-day plan: ACOS under 28% by end of week 8. One-page report: week 14, ACOS 28.5%, sales +12%, three next steps. Defense (8 minutes): explain each section, defend each decision, answer two follow-up questions. Pass level 85%+. The capstone is the proof."},
{t:"mistake",items:[
"Treating the capstone as a checkbox — the capstone is the proof of every lesson; a checkbox capstone is a missed program",
"Skipping the defense because 'the deliverable is the report' — the defense is where the judgment is tested; the report is a record, the defense is the judgment",
"Hiding bad data in the capstone — the capstone is graded on judgment, not on whether the account is healthy; a well-defended bad week is a higher score than a hidden bad week",
"Skipping the unit economics because 'I know them' — the unit economics are the foundation; without them, the bid and budget decisions are guesses"
]},
{t:"tip",x:"The capstone is the proof of every lesson in the program. The 12 modules, 60 lessons, the trainer, the builder, the report builder, the AI coach, the cohort — all of it converges on the capstone. The capstone is not a test of memorization. The capstone is a test of judgment under constraint. Pass level 85%+ means ready for supervised client work."}
]}
]},

{k:["acos"],t:"ACOS in plain words",a:"ACOS = Spend ÷ Sales × 100. It tells you how much of your ad sales went to paying for ads. Example: spend 20, sales 100 gives ACOS 20%. Rule of thumb: if ACOS is below your profit margin, the ads are likely profitable. If above, they likely lose money."},
{k:["roas"],t:"ROAS in plain words",a:"ROAS = Sales ÷ Spend. It is the mirror of ACOS. A ROAS of 5 means every ad dollar brought 5 dollars back. Higher is better."},
{k:["tacos"],t:"TACoS in plain words",a:"TACoS = Ad Spend ÷ Total Revenue × 100. Unlike ACOS, it compares ad spend to your whole business, including organic sales. A falling TACoS means ads are building a brand, not just renting sales."},
{k:["no sales","clicks but no"],t:"Clicks but no sales",a:"Shoppers click but do not buy. Check in order: 1) Are the search terms relevant? 2) Is the price competitive? 3) Are reviews strong? 4) Is the main image clear? 5) Is stock available? Irrelevant terms get negatives. A weak page gets fixed before more spend."},
{k:["negative"],t:"Negative keywords",a:"A negative keyword tells Amazon: do not show my ad for this. Use it when a search term gets clicks but can never buy your product (wrong material, wrong use, free, wholesale). Review the search term report weekly and block wasters."},
{k:["bid","bidding"],t:"Bid rules for beginners",a:"Raise bids on keywords with good sales and ACOS below margin. Lower bids on relevant keywords with ACOS above margin. Negate irrelevant ones. Change one thing at a time, then wait about a week before judging."},
{k:["budget"],t:"Budget basics",a:"Budget is your daily limit. If a profitable campaign runs out of budget by noon, you are missing sales — raise it. If a campaign is unprofitable, fix targeting before adding budget. Beginners often start with 10 to 25 per day per campaign."},

 res.scrollIntoView({behavior:"smooth",block:"nearest"});
 if(!state.trainerDone){ state.trainerDone=true; state.trainerBest=Math.max(state.trainerBest,score); save(); addXp(correct*5,"Search term trainer"); }
 else { if(score>state.trainerBest){state.trainerBest=score;save();toast("New best score: "+score+"%","info");} else toast("Practice round — best stays "+state.trainerBest+"%","info"); }

};

 '<div class="bg-white rounded-2xl p-6 shadow-card"><h3 class="font-display font-bold text-navy mb-3">Negative keywords</h3><div class="grid sm:grid-cols-[1fr_auto] gap-2"><input id="negText" placeholder="negative word, e.g. plastic" class="rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"><button type="button" onclick="addNeg()" class="bg-red-500 text-white font-bold text-sm px-4 rounded-xl hover:bg-red-600 transition">Add</button></div><div id="negList" class="mt-3 flex flex-wrap gap-2"></div></div></div>'+

window.scoreCampaign=function(){
 const pi=+document.getElementById("bProduct").value,prod=BUILDER_PRODUCTS[pi],name=document.getElementById("bName").value.trim(),budget=parseFloat(document.getElementById("bBudget").value)||0;
 const checks=[];
 checks.push({label:"Self-explaining campaign name",pass:(/sp\s*\|/i.test(name)&&name.length>8)||(/sp/i.test(name)&&name.toLowerCase().includes(prod.name.split(" ")[0].toLowerCase())),note:"Use a pattern like: SP | Exact | "+prod.name.split(" ")[0]+" | Core"});

 checks.push({label:"At least 2 Exact keywords",pass:exacts>=2,note:"Exact gives beginners control. You have "+exacts+" Exact keyword(s)."});

 checks.push({label:"At least 2 negative keywords",pass:negRows.length>=2,note:"Negatives protect your budget from day one."});

 updateTopbar();
};

RENDER.report=function(){
 const el=document.getElementById("view-report");
 el.innerHTML='<div class="grid lg:grid-cols-2 gap-5"><div class="bg-white rounded-2xl p-6 shadow-card space-y-4"><h2 class="font-display font-bold text-lg text-navy">📊 Weekly report builder</h2><p class="text-sm text-slate-500">Type the week\'s numbers. The app calculates metrics and drafts a client-ready report.</p><div class="grid grid-cols-2 sm:grid-cols-3 gap-3">'+[["rSpend","Spend ($)","210"],["rSales","Ad sales ($)","950"],["rClicks","Clicks","180"],["rImp","Impressions","4200"],["rOrders","Orders","19"],["rMargin","Margin (%)","30"]].map(f=>'<label class="text-xs font-bold text-slate-500">'+f[1]+'<input id="'+f[0]+'" type="number" value="'+f[2]+'" oninput="calcReport()" class="mt-1 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"></label>').join("")+'</div><div id="rMetrics" class="grid grid-cols-3 gap-2"></div><div class="space-y-3"><label class="text-xs font-bold text-slate-500 block">What worked<textarea id="rWins" rows="2" class="mt-1 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">Exact keyword produced steady sales. Auto campaign found a new winning search term.</textarea></label><label class="text-xs font-bold text-slate-500 block">Problems<textarea id="rIssues" rows="2" class="mt-1 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">Irrelevant search terms consumed part of the budget.</textarea></label><label class="text-xs font-bold text-slate-500 block">Next steps<textarea id="rNext" rows="2" class="mt-1 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">Add negatives for irrelevant terms. Move the new winner to Exact. Watch bids on high-ACOS keywords.</textarea></label></div><div class="flex gap-3"><button type="button" onclick="genReport()" class="bg-brand-500 hover:bg-brand-600 text-navy font-bold text-sm px-5 py-2.5 rounded-xl transition">Generate report</button><button type="button" onclick="copyReport()" class="bg-navy text-white font-bold text-sm px-5 py-2.5 rounded-xl hover:bg-navy-800 transition">Copy to clipboard</button></div></div><div class="bg-white rounded-2xl shadow-card overflow-hidden flex flex-col"><div class="bg-navy text-white px-6 py-4 font-display font-bold">Client-ready preview</div><pre id="rPreview" class="flex-1 p-6 text-[13px] leading-6 text-slate-600 whitespace-pre-wrap font-sans">Fill in the numbers and press "Generate report".</pre></div></div>';
 calcReport();
};
window.calcReport=function(){ const g=id=>parseFloat(document.getElementById(id).value)||0; const spend=g("rSpend"),sales=g("rSales"),clicks=g("rClicks"),imp=g("rImp"),orders=g("rOrders"),margin=g("rMargin");
 const acos=sales>0?(spend/sales*100):null,roas=spend>0?(sales/spend):0,cpc=clicks>0?spend/clicks:0,ctr=imp>0?clicks/imp*100:0,cvr=clicks>0?orders/clicks*100:0;
 const el=document.getElementById("rMetrics"); const card=(l,v,tone)=>'<div class="rounded-xl p-3 text-center border '+tone+'"><div class="text-[10px] font-bold uppercase text-slate-400">'+l+'</div><div class="font-display font-bold text-sm mt-0.5">'+v+'</div></div>';
 el.innerHTML=card("ACOS",acos===null?"—":acos.toFixed(0)+"%",acos===null?"border-slate-200 bg-slate-50 text-slate-500":(acos<=margin?"border-emerald-200 bg-emerald-50 text-emerald-700":"border-red-200 bg-red-50 text-red-600"))+card("ROAS",roas.toFixed(1)+"x","border-slate-200 bg-slate-50 text-navy")+card("CPC","$"+cpc.toFixed(2),"border-slate-200 bg-slate-50 text-navy")+card("CTR",ctr.toFixed(1)+"%","border-slate-200 bg-slate-50 text-navy")+card("CVR",cvr.toFixed(1)+"%","border-slate-200 bg-slate-50 text-navy")+card("Break-even",margin+"%","border-brand-200 bg-brand-50 text-brand-700");
 window._rCalc={acos,roas,cpc,ctr,cvr,spend,sales,clicks,orders,margin};
};
window.genReport=function(){ const c=window._rCalc; if(!c)return;
 const verdict=c.acos===null?"No sales recorded — review targeting and the listing before spending more.":(c.acos<=c.margin?"ACOS is below break-even ("+c.margin+"%), so the week looks profitable.":"ACOS is above break-even ("+c.margin+"%), so we must cut waste and adjust bids.");
 const txt="WEEKLY PPC REPORT\n-----------------\nSpend: $"+c.spend.toFixed(0)+"\nAd Sales: $"+c.sales.toFixed(0)+"\nACOS: "+(c.acos===null?"—":c.acos.toFixed(0)+"%")+" (break-even "+c.margin+"%)\nROAS: "+c.roas.toFixed(1)+"x\nClicks: "+c.clicks+" | Orders: "+c.orders+"\nCTR: "+c.ctr.toFixed(1)+"% | Conversion: "+c.cvr.toFixed(1)+"% | CPC: $"+c.cpc.toFixed(2)+"\n\nSummary: "+verdict+"\n\nWhat worked:\n- "+(document.getElementById("rWins").value||"—")+"\n\nProblems:\n- "+(document.getElementById("rIssues").value||"—")+"\n\nNext steps:\n- "+(document.getElementById("rNext").value||"—")+"\n\nPrepared by: Your PPC Assistant";
 document.getElementById("rPreview").textContent=txt; window._rText=txt;
 if(!state.reportDone){state.reportDone=true;save();addXp(15,"Report generated");} else toast("Report updated.","info");
 updateTopbar();
};
window.copyReport=function(){ if(!window._rText){toast("Generate the report first.","warn");return;} if(navigator.clipboard) navigator.clipboard.writeText(window._rText); toast("Report copied to clipboard.","info"); };

/* ---------- Quiz Arena (module quizzes + final exam) ---------- */
function quizDefs(){ return MODULES.map((m,i)=>({id:"m"+i,title:"Module "+(i+1)+" · "+m.title,icon:m.icon,color:m.color,questions:m.quiz})).concat([{id:"final",title:"FINAL EXAM · Competent Manager",icon:"🏆",color:"#0F172A",questions:FINAL_EXAM}]); }
window.takeQuiz=function(id){ const def=quizDefs().find(d=>d.id===id); qz={id:def.id,title:def.title,icon:def.icon,questions:def.questions,idx:0,score:0,locked:false}; showView("quiz"); };
RENDER.quiz=function(){
 const el=document.getElementById("view-quiz");
 if(qz){ paintQuizPlayer(el); return; }
 const defs=quizDefs();
 el.innerHTML='<div class="mb-5"><h2 class="font-display font-bold text-xl text-navy">Quiz Arena</h2><p class="text-sm text-slate-500 mt-1">A quiz after every module, plus a 15-question Final Exam. Pass mark 70%. First attempts earn 5 XP per correct answer.</p></div><div class="grid sm:grid-cols-2 xl:grid-cols-3 gap-4">'+defs.map(d=>{ const best=state.quizScores[d.id]; return '<div class="statcard bg-white rounded-2xl p-5 shadow-card border-t-4" style="border-color:'+d.color+'"><div class="flex items-start justify-between"><span class="text-3xl">'+d.icon+'</span>'+(best!==undefined?'<span class="text-[11px] font-bold px-2 py-1 rounded-full '+(best>=70?'bg-emerald-100 text-emerald-700':'bg-amber-100 text-amber-700')+'">Best '+best+'%</span>':'<span class="text-[11px] font-bold px-2 py-1 rounded-full bg-slate-100 text-slate-400">Not taken</span>')+'</div><div class="font-display font-bold text-navy mt-3 text-sm">'+d.title+'</div><div class="text-xs text-slate-400 mt-1">'+d.questions.length+' questions · pass 70%</div><button type="button" onclick="takeQuiz(\''+d.id+'\')" class="mt-4 w-full '+(d.id==='final'?'bg-navy text-white hover:bg-navy-800':'bg-brand-50 text-brand-700 hover:bg-brand-100 border border-brand-200')+' font-bold text-sm py-2.5 rounded-xl transition">'+(best!==undefined?'Retake':'Start')+'</button></div>'; }).join("")+'</div>';
};
function paintQuizPlayer(el){
 if(qz.idx>=qz.questions.length){
  const pct=Math.round(qz.score/qz.questions.length*100), first=state.quizScores[qz.id]===undefined;
  el.innerHTML='<div class="max-w-xl mx-auto bg-white rounded-2xl p-8 shadow-card text-center"><div class="pop mx-auto w-24 h-24 rounded-3xl flex items-center justify-center font-display font-bold text-3xl text-white '+(pct>=70?'bg-emerald-500':'bg-amber-500')+'">'+pct+'%</div><h2 class="font-display font-bold text-xl text-navy mt-4">'+qz.icon+' '+qz.score+' of '+qz.questions.length+' correct</h2><p class="text-sm text-slate-500 mt-2">'+(pct>=90?"Outstanding — manager material.":pct>=70?"Passed! Solid understanding.":"Review the module lessons and retry.")+'</p><div class="flex justify-center gap-3 mt-6"><button type="button" onclick="takeQuiz(\''+qz.id+'\')" class="bg-brand-500 hover:bg-brand-600 text-navy font-bold text-sm px-5 py-2.5 rounded-xl">Retry</button><button type="button" onclick="qz=null;showView(\'quiz\')" class="bg-slate-100 hover:bg-slate-200 text-navy font-bold text-sm px-5 py-2.5 rounded-xl">Back to Arena</button></div></div>';
  if(first){ state.quizScores[qz.id]=pct; save(); addXp(qz.score*(qz.id==='final'?4:5),"Quiz: "+qz.title.split("·")[0].trim()); }
  else if(pct>state.quizScores[qz.id]){ state.quizScores[qz.id]=pct; save(); toast("New best: "+pct+"%","info"); }
  publishSimHubQuizReceipt(qz.id,pct); updateTopbar(); return;
 }
 const q=qz.questions[qz.idx];
 el.innerHTML='<div class="max-w-2xl mx-auto"><div class="flex items-center justify-between mb-3 text-xs font-bold text-slate-400"><span>'+qz.icon+' '+qz.title+'</span><span>Q '+(qz.idx+1)+'/'+qz.questions.length+' · Score '+qz.score+'</span></div><div class="h-2 rounded-full bg-slate-200 overflow-hidden mb-5"><div class="bar h-full bg-brand-500" style="width:'+((qz.idx/qz.questions.length)*100)+'%"></div></div><div class="bg-white rounded-2xl p-6 md:p-8 shadow-card"><h2 class="font-display font-bold text-lg text-navy">'+q.q+'</h2><div class="mt-5 space-y-2.5">'+q.o.map((o,i)=>'<button type="button" onclick="answerQuiz('+i+')" class="quizopt w-full text-left rounded-xl border-2 border-slate-200 hover:border-brand-400 hover:bg-brand-50 px-4 py-3 text-sm font-semibold text-slate-600 transition">'+o+'</button>').join("")+'</div><div id="quizFb" class="hidden mt-5 rounded-xl p-4 text-sm"></div><div class="mt-5 text-right"><button type="button" id="quizNext" onclick="qz.idx++;qz.locked=false;paintQuizPlayer(document.getElementById(\'view-quiz\'))" class="hidden bg-navy text-white font-bold text-sm px-6 py-2.5 rounded-xl hover:bg-navy-800 transition">Next →</button></div></div></div>';
}
window.answerQuiz=function(i){
 if(!qz||qz.locked)return; qz.locked=true;
 const q=qz.questions[qz.idx], opts=[...document.querySelectorAll(".quizopt")];
 opts.forEach((b,bi)=>{ b.classList.remove("hover:border-brand-400","hover:bg-brand-50"); if(bi===q.a){b.classList.add("border-emerald-500","bg-emerald-50","text-emerald-700");} else if(bi===i){b.classList.add("border-red-400","bg-red-50","text-red-600");} else b.classList.add("opacity-50"); });
 if(i===q.a) qz.score++;
 const fb=document.getElementById("quizFb"); fb.classList.remove("hidden");
 fb.className="mt-5 rounded-xl p-4 text-sm "+(i===q.a?"bg-emerald-50 text-emerald-700 border border-emerald-200":"bg-red-50 text-red-600 border border-red-200");
 fb.innerHTML="<b>"+(i===q.a?"Correct!":"Not quite.")+"</b> "+q.e;
 document.getElementById("quizNext").classList.remove("hidden");
};

let coachMsgs=[{who:"coach",text:"Hi! I am your PPC coach. Ask me anything in plain words — ACOS, bids, negatives, why you get clicks but no sales. I explain with simple examples."}];
RENDER.coach=function(){
 const el=document.getElementById("view-coach");
 el.innerHTML='<div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-card overflow-hidden flex flex-col" style="height:calc(100vh - 140px);min-height:480px"><div class="flex items-center gap-3 bg-navy text-white px-5 py-4"><img src="'+IMG.coach+'" class="w-10 h-10 rounded-full bg-white p-0.5" alt="coach"><div><div class="font-display font-bold">Coach Bot</div><div class="text-[11px] text-emerald-400 font-semibold">● Always on · plain-words mode</div></div></div><div id="chatBox" class="flex-1 overflow-y-auto p-5 space-y-4 bg-slate-50"></div><div class="p-4 bg-white border-t border-slate-100"><div class="flex flex-wrap gap-2 mb-3">'+["What is ACOS?","Clicks but no sales — why?","When should I add a negative keyword?","My campaign has no impressions","How do I start a new product?"].map(c=>'<button type="button" onclick="sendCoach(\''+c+'\')" class="text-[11px] font-bold bg-brand-50 text-brand-700 border border-brand-200 rounded-full px-3 py-1.5 hover:bg-brand-100 transition">'+c+'</button>').join("")+'</div><div class="flex gap-2"><input id="coachInput" onkeydown="if(event.key===\'Enter\')sendCoach()" placeholder="Ask in plain words…" class="flex-1 rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"><button type="button" onclick="sendCoach()" class="bg-brand-500 hover:bg-brand-600 text-navy font-bold px-5 rounded-xl transition">Send</button></div></div></div>';
 paintChat();
};
function escapeHtml(value){ return String(value).replace(/[&<>"']/g, char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char])); }
function paintChat(){ const box=document.getElementById("chatBox"); if(!box)return;
 box.innerHTML=coachMsgs.map(m=>m.who==="coach"?'<div class="chatmsg flex gap-3"><img src="'+IMG.coach+'" class="w-8 h-8 rounded-full bg-white border border-slate-200 shrink-0" alt=""><div class="bg-white border border-slate-200 rounded-2xl rounded-tl-sm px-4 py-3 text-sm text-slate-600 max-w-[85%] shadow-sm"><b class="text-navy block mb-1">'+escapeHtml(m.title||"Coach")+'</b>'+escapeHtml(m.text)+'</div></div>':'<div class="chatmsg flex justify-end"><div class="bg-navy text-white rounded-2xl rounded-tr-sm px-4 py-3 text-sm max-w-[85%]">'+escapeHtml(m.text)+'</div></div>').join("");
 box.scrollTop=box.scrollHeight; }
window.sendCoach=function(fixed){ const input=document.getElementById("coachInput"); const text=fixed||input.value.trim(); if(!text)return; input.value="";
 coachMsgs.push({who:"me",text}); if(!state.coachAsked){state.coachAsked=true;save();addXp(5,"Asked the coach");updateTopbar();}
 paintChat(); const box=document.getElementById("chatBox");
 box.insertAdjacentHTML("beforeend",'<div id="typing" class="chatmsg flex gap-3"><img src="'+IMG.coach+'" class="w-8 h-8 rounded-full bg-white border border-slate-200" alt=""><div class="bg-white border border-slate-200 rounded-2xl px-4 py-3 flex gap-1.5 items-center"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>');
 box.scrollTop=box.scrollHeight;
 setTimeout(()=>{ const t=document.getElementById("typing"); if(t)t.remove(); const r=coachReply(text); coachMsgs.push({who:"coach",title:r.t,text:r.a}); paintChat(); },700); };
function coachReply(text){ const q=text.toLowerCase(); for(const r of COACH_RULES){ if(r.k.some(k=>q.includes(k))) return r; } return {t:"Let us break it down",a:"Almost every PPC problem is one of four leaks: not enough impressions (bid or budget), not enough clicks (image, price, title), not enough sales (listing, reviews, wrong terms), or too much cost (bids and negatives). Tell me which number looks wrong — or ask about ACOS, bids, negatives, match types or reporting."}; }

/* ---------- Cohort ---------- */
RENDER.cohort=function(){
 const el=document.getElementById("view-cohort");
 const avg=Math.round(COHORT.reduce((a,s)=>a+s.prog,0)/COHORT.length), risk=COHORT.filter(s=>s.status==="risk").length, star=COHORT.reduce((a,s)=>s.prog>a.prog?s:a);
 el.innerHTML='<div class="grid sm:grid-cols-3 gap-4 mb-5"><div class="statcard bg-white rounded-2xl p-5 shadow-card"><div class="text-xs font-bold text-slate-400 uppercase">Cohort average</div><div class="font-display font-bold text-3xl text-navy mt-1">'+avg+'%</div><div class="h-2 mt-3 rounded-full bg-slate-100 overflow-hidden"><div class="bar h-full bg-brand-500" style="width:'+avg+'%"></div></div></div><div class="statcard bg-white rounded-2xl p-5 shadow-card"><div class="text-xs font-bold text-slate-400 uppercase">Students at risk</div><div class="font-display font-bold text-3xl text-red-500 mt-1">'+risk+'</div><div class="text-xs text-slate-500 mt-2">Inactive 3+ days or stuck under 30%</div></div><div class="statcard bg-white rounded-2xl p-5 shadow-card"><div class="text-xs font-bold text-slate-400 uppercase">Top performer</div><div class="font-display font-bold text-2xl text-emerald-600 mt-1">🏆 '+star.name+'</div><div class="text-xs text-slate-500 mt-2">'+star.prog+'% · '+star.xp+' XP</div></div></div>'+
 '<div class="bg-white rounded-2xl shadow-card overflow-hidden"><div class="flex flex-wrap items-center gap-3 p-5 border-b border-slate-100"><h2 class="font-display font-bold text-navy">Students</h2><input id="cohortSearch" oninput="filterCohort()" placeholder="Search student…" class="ml-auto w-full sm:w-64 rounded-xl border border-slate-200 bg-slate-50 px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"></div><div class="overflow-x-auto"><table class="w-full text-sm min-w-[720px]" id="cohortTable"><thead><tr class="bg-slate-50 text-left text-xs text-slate-400 uppercase"><th class="px-5 py-3">Student</th><th class="px-5 py-3">Level</th><th class="px-5 py-3 w-56">Progress</th><th class="px-5 py-3">XP</th><th class="px-5 py-3">Weak area</th><th class="px-5 py-3">Last active</th><th class="px-5 py-3">Status</th></tr></thead><tbody>'+cohortRows(COHORT)+'</tbody></table></div><div class="p-4 bg-slate-50 text-xs text-slate-400">💡 Teaching tip: run the <b>Search Term Trainer</b> live in class and let students defend their decisions out loud — judgment grows faster than button-clicking.</div></div>';
};
function cohortRows(list){ return list.map(s=>{ const st=s.status==="star"?'<span class="text-[10px] font-bold px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-700">STAR</span>':s.status==="risk"?'<span class="text-[10px] font-bold px-2.5 py-1 rounded-full bg-red-100 text-red-600">AT RISK</span>':'<span class="text-[10px] font-bold px-2.5 py-1 rounded-full bg-sky-100 text-sky-700">ON TRACK</span>'; return '<tr class="border-b border-slate-100 hover:bg-slate-50"><td class="px-5 py-3.5 font-bold text-navy">'+s.name+'</td><td class="px-5 py-3.5 text-slate-500">'+s.lvl+'</td><td class="px-5 py-3.5"><div class="flex items-center gap-2"><div class="flex-1 h-2 rounded-full bg-slate-100 overflow-hidden"><div class="bar h-full bg-brand-500" style="width:'+s.prog+'%"></div></div><span class="text-xs font-bold text-slate-500">'+s.prog+'%</span></div></td><td class="px-5 py-3.5 font-semibold text-slate-600">⚡'+s.xp+'</td><td class="px-5 py-3.5 text-slate-500">'+s.weak+'</td><td class="px-5 py-3.5 text-slate-500">'+s.last+'</td><td class="px-5 py-3.5">'+st+'</td></tr>'; }).join(""); }
window.filterCohort=function(){ const q=document.getElementById("cohortSearch").value.toLowerCase(); document.querySelector("#cohortTable tbody").innerHTML=cohortRows(COHORT.filter(s=>s.name.toLowerCase().includes(q))); };

(function(){
  // Deep-link: ../ppc-coach.html#m1 .. #m12 opens that module in the Lessons view.
  // Also #m1l1 .. opens a specific lesson. Additive — runs after first render.
  function applyHash(){
    var h=location.hash||"";
    var m=h.match(/^#m(\d+)(?:l(\d+))?$/i);
    if(!m)return;
    var mi=parseInt(m[1],10)-1, li=m[2]?parseInt(m[2],10)-1:null;
    if(isNaN(mi)||mi<0||mi>=MODULES.length)return;
    showView("lessons");
    if(li!==null && !isNaN(li) && li>=0 && li<MODULES[mi].lessons.length){
      openLesson(mi,li);
    } else {
      openModule(mi);
    }
  }
  if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded",applyHash); } else { applyHash(); }
  window.addEventListener("hashchange",applyHash);
})();
